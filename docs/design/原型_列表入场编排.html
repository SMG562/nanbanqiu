<title>场边入场实验室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：顶部一排控制，下面左右两部手机并排对比（窄屏上下叠放）；可放大、可慢放。配色沿用场边主题，浅 / 深色跟随系统 */
:root{
  --bg:#EEF1EE;--panel:#FFFFFF;--ink:#1B2620;--ink2:#44504A;--mut:#5F6D66;--hair:rgba(27,38,32,.1);
  --acc:#176B4D;--lime:#C6EA3D;--app:#F2F4F2;--card:#FFFFFF;--phone:#0E1512;--newc:#E4F1A6;--sheen:23,107,77;--sheenA:.022;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B120F;--panel:#131C18;--ink:#EAF1EC;--ink2:#B7C4BC;--mut:#8C9A92;--hair:rgba(234,241,236,.12);
  --acc:#7BD3A8;--app:#101914;--card:#18231D;--phone:#050806;--newc:#34502A;--sheen:255,255,255;--sheenA:.03;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B120F;--panel:#131C18;--ink:#EAF1EC;--ink2:#B7C4BC;--mut:#8C9A92;--hair:rgba(234,241,236,.12);--acc:#7BD3A8;--app:#101914;--card:#18231D;--phone:#050806;--newc:#34502A;--sheen:255,255,255;--sheenA:.03;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{max-width:1180px;margin:0 auto 16px}
h1{font-size:21px;margin:0 0 4px;letter-spacing:.02em}
.sub{color:var(--mut);font-size:13px;line-height:1.6;margin:0 0 14px;max-width:70ch}
.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--panel);border:1px solid var(--hair);border-radius:14px;padding:12px 14px}
.cg{display:flex;align-items:center;gap:8px;min-width:0}
.cg>b{font-size:11px;letter-spacing:.12em;color:var(--mut);font-weight:600;white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button,.btn{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--hair);background:transparent;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.pri{color:#07120C}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#07120C}}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=range]{accent-color:var(--acc);width:110px}
.val{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:34px}
.stages{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 20px;justify-items:center}
@media(max-width:820px){.stages{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;max-width:100%}
.lab{font-size:13px;color:var(--ink2);text-align:center;max-width:44ch;line-height:1.55;min-height:3.6em}
.lab b{color:var(--ink);font-size:14px}
.phone{width:392px;height:760px;border-radius:44px;background:var(--phone);padding:10px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5);zoom:var(--z,1);max-width:100%}
.screen{height:100%;border-radius:36px;background:var(--app);overflow:hidden;position:relative;display:flex;flex-direction:column}
.bar{flex:none;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:15px;font-weight:700;letter-spacing:.04em}
.bar small{font-weight:500;color:var(--mut);font-size:12px;letter-spacing:0}
.feed{flex:1;overflow-y:auto;padding:6px 12px 24px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.grp{display:flex;flex-direction:column;gap:12px;flex:none}
.feed>*,.grp>*{flex:none}
/* ---- 新帖胶囊 ---- */
.more{position:absolute;left:50%;top:54px;z-index:5;height:32px;padding:0 14px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font:inherit;font-size:12.5px;font-weight:600;letter-spacing:.02em;cursor:pointer;
  opacity:0;transform:translate(-50%,-6px);pointer-events:none;box-shadow:0 8px 20px -10px rgba(0,0,0,.5);
  transition:opacity calc(.7s * var(--k)) cubic-bezier(.33,0,.2,1),transform calc(.9s * var(--k)) cubic-bezier(.19,1,.22,1)}
.more.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.more.tap{opacity:0;transform:translate(-50%,-4px) scale(.94);transition-duration:calc(.4s * var(--k))}
.more .n{display:inline-block;font-variant-numeric:tabular-nums}
/* ---- 卡片 ---- */
.post{--sh:0 0 0 .5px var(--hair),0 10px 24px -18px rgba(20,30,25,.4);position:relative;background:var(--card);border-radius:20px;padding:14px 14px 12px;overflow:hidden;box-shadow:var(--sh)}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.av{width:24px;height:24px;border-radius:50%;flex:none}.who b{color:var(--ink);font-weight:600}
.txt{font-size:15px;line-height:1.55;margin:8px 0 0}
.meta{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:10px}
.pic{position:relative;margin-top:10px;border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:rgba(127,140,132,.18)}
.pic.tall{aspect-ratio:4/5}.pic .im{position:absolute;inset:0}
/* 每种效果只是一组参数：升起距离 / 起始缩放 / 起始底色浓度 / 是否有柔光 / 起始阴影 */
.post.pre{opacity:0;transform:translateY(var(--rise)) scale(var(--sc));transform-origin:50% 0;background:color-mix(in srgb,var(--card) var(--surf),var(--app));box-shadow:var(--sh0);will-change:opacity,transform}
.post.go{opacity:1;transform:none;background:var(--card);box-shadow:var(--sh);
  transition:opacity calc(var(--dur) * var(--k)) var(--eo) calc(var(--d,0ms) * var(--k)),transform calc(var(--dur) * 1.3 * var(--k)) var(--ease) calc(var(--d,0ms) * var(--k)),background-color calc(var(--dur) * 1.8 * var(--k)) var(--eo) calc(var(--d,0ms) * var(--k)),box-shadow calc(var(--dur) * 1.8 * var(--k)) var(--ease) calc(var(--d,0ms) * var(--k))}
.post.pre>*{opacity:0}
.post.go>*{opacity:1;transition:opacity calc(var(--dur) * .8 * var(--k)) var(--eo) calc((var(--d,0ms) + 0ms) * var(--k))}
.post.go>.txt{transition-delay:calc((var(--d,0ms) + 120ms) * var(--k))}.post.go>.pic{transition-delay:calc((var(--d,0ms) + 240ms) * var(--k))}.post.go>.meta{transition-delay:calc((var(--d,0ms) + 360ms) * var(--k))}
.post::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:inherit;background:linear-gradient(104deg,transparent 18%,rgba(var(--sheen),var(--sheenA)) 50%,transparent 82%);background-size:300% 100%;background-position:130% 0}
.stage[data-sheen="1"] .post.go.lit::before{animation:sheen calc(var(--dur) * 3.6 * var(--k)) cubic-bezier(.4,0,.2,1) calc(var(--d,0ms) * var(--k)) both}
@keyframes sheen{0%{opacity:0;background-position:130% 0}20%{opacity:1}75%{opacity:1}100%{opacity:0;background-position:-30% 0}}
.pic .im{opacity:0;transform:scale(1.025);filter:blur(5px) saturate(.78) brightness(.97)}
.pic.dev .im{opacity:1;transform:none;filter:none;transition:opacity calc(1.7s * var(--k)) var(--eo),transform calc(2.2s * var(--k)) var(--ease),filter calc(1.8s * var(--k)) var(--eo)}
/* ---- 新帖强调（三档）：左缘线 + 底色淡淡染一层新叶绿，随时间褪去 ---- */
.post.fresh{background:color-mix(in srgb,var(--card) calc(100% - var(--ft) * 1%),var(--newc));box-shadow:var(--sh),inset var(--fl) 0 0 rgba(198,234,61,.7)}
.post.fresh.go{transition:opacity calc(var(--dur) * var(--k)) var(--eo) calc(var(--d,0ms) * var(--k)),transform calc(var(--dur) * 1.3 * var(--k)) var(--ease) calc(var(--d,0ms) * var(--k)),background-color calc(var(--dur) * 1.8 * var(--k)) var(--eo) calc(var(--d,0ms) * var(--k)),box-shadow calc(var(--dur) * 1.8 * var(--k)) var(--ease) calc(var(--d,0ms) * var(--k))}
.post.settle{background:var(--card);box-shadow:var(--sh),inset 0 0 0 rgba(198,234,61,0);transition:background-color calc(3.2s * var(--k)) cubic-bezier(.33,0,.2,1),box-shadow calc(3.2s * var(--k)) cubic-bezier(.33,0,.2,1)}
.divider{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.16em;color:var(--mut);padding:2px 6px;opacity:0;transition:opacity calc(1s * var(--k)) var(--eo)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--hair)}
.divider.on{opacity:1}
@media(prefers-reduced-motion:reduce){.post.pre,.post.pre>*{opacity:1;transform:none}.pic .im{opacity:1;transform:none;filter:none}}
</style>

<div class="top">
  <h1>场边入场实验室</h1>
  <p class="sub">左右两部手机同时播放，可以放大、慢放，对比不同的入场效果。点「全流程演示」会自动走一遍：刚进来 → 往下刷 → 来了新帖 → 点胶囊回顶 → 新帖亮起。</p>
  <div class="ctl">
    <div class="cg"><b>左</b><div class="seg" data-k="fxA"></div></div>
    <div class="cg"><b>右</b><div class="seg" data-k="fxB"></div></div>
    <div class="cg"><b>新帖强调</b><div class="seg" data-k="emph"><button type="button" data-v="low">微</button><button type="button" data-v="mid">中</button><button type="button" data-v="high">显</button></div></div>
    <div class="cg"><b>速度</b><div class="seg" data-k="k"><button type="button" data-v="1">1×</button><button type="button" data-v="2">0.5×</button><button type="button" data-v="4">0.25×</button></div></div>
    <div class="cg"><b>放大</b><input id="zoom" type="range" min="100" max="150" value="115" aria-label="放大"><span class="val" id="zv">1.15×</span></div>
    <div class="cg"><button class="btn pri" id="demo" type="button">全流程演示</button><button class="btn" id="replay" type="button">重播入场</button><button class="btn" id="arrive" type="button">新帖到达</button><button class="btn" id="down" type="button">往下滑</button></div>
  </div>
</div>
<div class="stages">
  <div class="col"><div class="phone"><div class="screen stage" id="sA"><div class="bar"><span>场边</span><small>墨尔本 · 今天</small></div><button class="more" type="button"></button><div class="feed"></div></div></div><div class="lab" id="lA"></div></div>
  <div class="col"><div class="phone"><div class="screen stage" id="sB"><div class="bar"><span>场边</span><small>墨尔本 · 今天</small></div><button class="more" type="button"></button><div class="feed"></div></div></div><div class="lab" id="lB"></div></div>
</div>

<script>
(function(){
  var POSTS=[
    {n:'阿哲',c:'#E8B04A',t:'今晚 Albert Park 有人加练吗？想拉一拉底线，水平 3.5 左右。',b:3,r:5,p:['#F6C177','#E07A5F','#3D405B']},
    {n:'Mia',c:'#6FBF9A',t:'周六早上的红土，雾还没散，场边的咖啡比球先到。',b:12,r:2,p:['#CFE8D8','#6FA98A','#1F4D3A'],tall:1},
    {n:'老周',c:'#8FA7D6',t:'发球总是下网，有没有人愿意陪我练一小时？请你喝水。',b:6,r:8},
    {n:'Jay',c:'#D98F9B',t:'新换的拍线 24 磅，手感软了很多，推荐。',b:9,r:3,p:['#F4D6CC','#C9877A','#5B3A4A']},
    {n:'小柚',c:'#B6D36A',t:'一个人来练墙，也想认识打球的朋友。',b:4,r:1},
    {n:'Leo',c:'#7FC4D9',t:'周日下午双打缺一，Brunswick，有灯。',b:7,r:6,p:['#BFE3EA','#5FA3B8','#1D4352']},
    {n:'阿宁',c:'#C9A7E0',t:'夜场的灯一亮，整个场子都变得很安静。',b:15,r:4,p:['#2B3A55','#5C6BC0','#F4E4A6'],tall:1},
    {n:'Tom',c:'#E5A56F',t:'刚打完，今天的反手终于稳了一次。',b:5,r:0},
    {n:'Ken',c:'#9DB4C0',t:'有人想周三中午在 Fitzroy 打一小时吗？',b:2,r:3},
    {n:'晓雯',c:'#E6B8A2',t:'雨停了，场地还有点湿，但太阳出来了。',b:8,r:2,p:['#D9E6EC','#8FB3C4','#33546B']},
    {n:'Sam',c:'#A8C98F',t:'第一次来墨尔本，想找人打球，英文中文都可以。',b:11,r:9},
    {n:'老陈',c:'#D9A66B',t:'退休后每天早上六点的球，风雨无阻。',b:21,r:12,p:['#F2D9B0','#D49A5B','#5A3E24']}];
  var NEW=[
    {n:'Ava',c:'#8CC9B4',t:'刚订到明早七点的场，缺一个人。',b:0,r:0},
    {n:'Ben',c:'#E0A27A',t:'谁在 Royal Park？看到有人在练发球。',b:0,r:0,p:['#F7E3B5','#E3A857','#6B4A1F']},
    {n:'Cici',c:'#B9A3E3',t:'新手友好，一起来练基础。',b:0,r:0}];
  // 效果 = 一组参数。rise 升起像素；sc 起始缩放；surf 起始底色浓度（100 = 不变）；sheen 柔光；dur 单张时长（秒）
  var FX={
    fade:{name:'只淡入',rise:0,sc:1,surf:100,sheen:0,dur:1.2,sh0:'var(--sh)',d:'只有淡入。最稳，没有位移，也没有「被点亮」的感觉。'},
    rise:{name:'只升起',rise:8,sc:1,surf:100,sheen:0,dur:1.3,sh0:'var(--sh)',d:'淡入 + 升起 8 像素。干净，但缺少质感和呼吸。'},
    sheen:{name:'静光（更淡）',rise:6,sc:.994,surf:84,sheen:1,dur:1.5,sh0:'0 0 0 .5px var(--hair),0 2px 6px -4px rgba(20,30,25,.2)',d:'表面由略暗变回本色；掠过的柔光降到原来的 40%，几乎要凑近才看得出，只作为一点点呼吸的余韵。'},
    breath:{name:'呼吸（定稿候选）',rise:8,sc:.986,surf:84,sheen:0,dur:1.7,sh0:'0 0 0 .5px var(--hair),0 1px 3px -2px rgba(20,30,25,.14)',d:'没有任何掠过的光。卡片像吸一口气：从略小、略低、略暗，慢慢舒展到本来的大小，阴影随之由紧变松，内容分四层落稳。位置和大小的变化是主角。'},
    layer:{name:'叠层（新）',rise:12,sc:.99,surf:70,sheen:0,dur:1.9,sh0:'0 0 0 .5px var(--hair)',d:'位移更大一点（12px）、底色更暗（70%）、总时长更长；强调「从背景里浮上来」的层次感，节奏最舒缓。'}};
  var TEMPO={start:320,gap:[300,240,200,200,220,260]};
  var EMPH={low:{ft:0,fl:'1.5px',div:0},mid:{ft:11,fl:'1.5px',div:1},high:{ft:22,fl:'2.5px',div:1}};
  var CFG={fxA:'sheen',fxB:'breath',emph:'mid',k:'1'};
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var EASE='cubic-bezier(.19,1,.22,1)',EO='cubic-bezier(.33,0,.2,1)';
  var K=function(){return +CFG.k};

  function mk(p){
    var pic=p.p?'<div class="pic'+(p.tall?' tall':'')+'"><div class="im" style="background:radial-gradient(90% 70% at 30% 25%,'+p.p[0]+','+p.p[1]+' 55%,'+p.p[2]+')"></div></div>':'';
    var a=document.createElement('article');a.className='post pre';
    a.innerHTML='<div class="who"><span class="av" style="background:'+p.c+'"></span><b>'+p.n+'</b><span>· 刚刚</span></div><p class="txt">'+p.t+'</p>'+pic+'<div class="meta"><span>🎾 '+p.b+'</span><span>回复 '+p.r+'</span></div>';return a}
  function easeIO(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}

  function Stage(root,key,labEl){
    var feed=root.querySelector('.feed'),more=root.querySelector('.more'),T=[],pend=[],nn=0,grp=null;
    function later(f,ms){T.push(setTimeout(f,ms))}
    function stop(){T.forEach(clearTimeout);T=[];grp=null}
    function vars(){
      var f=FX[CFG[key]],e=EMPH[CFG.emph],st=root.style;
      st.setProperty('--rise',f.rise+'px');st.setProperty('--sc',f.sc);st.setProperty('--surf',f.surf+'%');st.setProperty('--sh0',f.sh0);
      st.setProperty('--dur',f.dur+'s');st.setProperty('--ease',EASE);st.setProperty('--eo',EO);st.setProperty('--k',K());
      st.setProperty('--ft',e.ft);st.setProperty('--fl',e.fl);root.dataset.sheen=f.sheen;
      labEl.innerHTML='<b>'+(key==='fxA'?'左 · ':'右 · ')+f.name+'</b><br>'+f.d;
    }
    function land(el,at,fresh){
      el.style.setProperty('--d',at+'ms');
      requestAnimationFrame(function(){requestAnimationFrame(function(){el.classList.remove('pre');el.classList.add('go','lit');if(fresh)el.classList.add('fresh')})});
    }
    function dev(el,at){var p=el.querySelector('.pic');if(p)later(function(){p.classList.add('dev')},at*K())}
    function cascade(els,fresh){
      var f=FX[CFG[key]],t=TEMPO.start*(fresh?.6:1),last=null;
      els.forEach(function(e,i){
        land(e,t,fresh);
        if(e.querySelector('.pic')){var dv=Math.max(t+f.dur*1000*.9+240,last==null?0:last+260);dev(e,dv);last=dv}
        t+=TEMPO.gap[Math.min(i,TEMPO.gap.length-1)];
      });
    }
    function play(){
      stop();pend=[];nn=0;more.className='more';vars();feed.innerHTML='';feed.scrollTop=0;
      var els=POSTS.map(mk);els.forEach(function(e){feed.appendChild(e)});
      if(reduce){els.forEach(function(e){e.classList.remove('pre');var p=e.querySelector('.pic');if(p)p.classList.add('dev')});return}
      var H=feed.clientHeight,first=els.filter(function(c){return c.offsetTop<H-40}),rest=els.filter(function(c){return first.indexOf(c)<0});
      cascade(first,false);
      rest.forEach(function(e){e.style.setProperty('--d','0')});
      var io=new IntersectionObserver(function(es){es.forEach(function(x){if(!x.isIntersecting)return;io.unobserve(x.target);x.target.classList.remove('pre');x.target.classList.add('go');var p=x.target.querySelector('.pic');if(p)later(function(){p.classList.add('dev')},260*K())})},{root:feed,threshold:.12});
      rest.forEach(function(e){io.observe(e)});
    }
    function pillText(){more.innerHTML='↑ <span class="n">'+pend.length+'</span> 条新动态'}
    function arrive(){
      pend.push(NEW[nn++%NEW.length]);var was=more.classList.contains('show');more.classList.remove('tap');pillText();
      if(was)more.animate([{transform:'translate(-50%,0) scale(1)'},{transform:'translate(-50%,0) scale(1.06)'},{transform:'translate(-50%,0) scale(1)'}],{duration:520*K(),easing:EO});
      more.classList.add('show');
    }
    function scrollTo0(done){
      var from=feed.scrollTop;if(from<6||reduce){feed.scrollTop=0;done();return}
      var dur=Math.min(1000,Math.max(520,380+from*.35))*K(),t0=performance.now();
      (function step(now){var k=Math.min(1,(now-t0)/dur);feed.scrollTop=from*(1-easeIO(k));if(k<1)requestAnimationFrame(step);else done()})(t0);
    }
    function flush(){
      if(!pend.length)return;var items=pend.slice();pend=[];more.classList.add('tap');
      scrollTo0(function(){
        more.className='more';
        var els=items.slice().reverse().map(mk),e=EMPH[CFG.emph],f=FX[CFG[key]];
        var host=document.createElement('div');host.className='grp';host.style.overflow='hidden';
        var dv=null;if(e.div){dv=document.createElement('div');dv.className='divider';dv.textContent='刚到 '+items.length+' 条';host.appendChild(dv)}
        els.forEach(function(x){host.appendChild(x)});
        // 分隔线放在新帖组的下面，指出「从这里往上是新的」
        if(dv)host.appendChild(dv);
        feed.insertBefore(host,feed.firstChild);
        var h=host.offsetHeight+12;
        var g=host.animate([{height:'0px'},{height:h+'px'}],{duration:f.dur*700*K(),easing:EASE});
        g.onfinish=function(){host.style.overflow='';host.style.height=''};
        cascade(els,true);
        if(dv)later(function(){dv.classList.add('on')},(TEMPO.start+800)*K());
        later(function(){els.forEach(function(x){x.classList.add('settle')});if(dv)dv.classList.remove('on')},6500*K());
      });
    }
    function down(px){
      var from=feed.scrollTop,to=Math.min(from+(px||520),feed.scrollHeight-feed.clientHeight),dur=1300*K(),t0=performance.now();
      (function step(now){var k=Math.min(1,(now-t0)/dur);feed.scrollTop=from+(to-from)*easeIO(k);if(k<1)requestAnimationFrame(step)})(t0);
    }
    more.addEventListener('click',flush);
    return {play:play,arrive:arrive,flush:flush,down:down,stop:stop,vars:vars,pend:function(){return pend.length}};
  }

  var A=Stage(document.getElementById('sA'),'fxA',document.getElementById('lA')),B=Stage(document.getElementById('sB'),'fxB',document.getElementById('lB'));
  var demoT=[];
  function both(m,a){A[m](a);B[m](a)}
  function demo(){
    demoT.forEach(clearTimeout);demoT=[];both('play');var k=K(),at=0;
    function s(ms,f){at+=ms*k;demoT.push(setTimeout(f,at))}
    s(5200,function(){both('down',560)});
    s(2000,function(){both('arrive')});
    s(900,function(){both('arrive')});
    s(2200,function(){both('flush')});
  }
  function renderCtl(){
    [].forEach.call(document.querySelectorAll('.seg[data-k=fxA],.seg[data-k=fxB]'),function(g){
      if(!g.children.length)Object.keys(FX).forEach(function(id){var b=document.createElement('button');b.type='button';b.dataset.v=id;b.textContent=FX[id].name;g.appendChild(b)})});
    [].forEach.call(document.querySelectorAll('.seg'),function(g){[].forEach.call(g.children,function(b){b.setAttribute('aria-pressed',String(String(CFG[g.dataset.k])===b.dataset.v))})});
  }
  [].forEach.call(document.querySelectorAll('.seg'),function(g){g.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;CFG[g.dataset.k]=b.dataset.v;renderCtl();demoT.forEach(clearTimeout);both('play')})});
  document.getElementById('replay').onclick=function(){demoT.forEach(clearTimeout);both('play')};
  document.getElementById('arrive').onclick=function(){both('arrive')};
  document.getElementById('down').onclick=function(){both('down',560)};
  document.getElementById('demo').onclick=demo;
  var zr=document.getElementById('zoom');function zoom(){var z=zr.value/100;document.documentElement.style.setProperty('--z',z);document.getElementById('zv').textContent=z.toFixed(2)+'×'}
  zr.oninput=zoom;zoom();
  // 点胶囊：谁的胶囊点谁（两部手机各自独立），也可以点上面的「新帖到达」再自己点
  renderCtl();both('play');
})();
</script>
