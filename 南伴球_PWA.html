  if(!ME)return `<button class="invbtn" data-iv="new" data-u="${uid}">约 TA 打球</button>`;
  const lim=(U(uid)||{}).invite_from||'all';if(lim==='none'||(lim==='played'&&!playedTogether(ME.id,uid)))return `<div class="invbtn off">${lim==='none'?'TA 暂时不接受邀约':'TA 只接受打过球的球友邀约'}</div>`;
  const open=INVITES.find(i=>[i.from,i.to].includes(uid)&&[i.from,i.to].includes(ME.id)&&['pending','counter'].includes(i.status)&&!invExpired(i));
  if(open){const mine=open.status==='pending'?open.from===ME.id:open.to===ME.id;
    return `<button class="invbtn ${mine?'wait':''}" data-iv="view" data-i="${open.id}">${mine?'已约 · 等 TA 回复':open.status==='counter'?'TA 提议了新时间 · 去确认':'TA 约了你 · 去回复'}<small>${esc(invWhen(open))} · ${esc(invWhere(open))}</small></button>`}
  const next=gamesTogether(ME.id,uid).filter(g=>new Date(g.starts_at)>NOW).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at))[0];
  if(next){const s=new Date(next.starts_at);return `<button class="invbtn wait" data-iv="gameOf" data-g="${next.id}">你们${relDay(s)} ${hm(s)} 有一场 · 查看<small>${esc(venTxt(next.venue_id))}</small></button>`}
  const n=playedCount(ME.id,uid),u=U(uid);
  return n?`<button class="invbtn" data-iv="new" data-u="${uid}">再约一局<small>你们一起打过 ${n} 场</small></button>`
          :`<button class="invbtn soft" data-iv="new" data-u="${uid}">约 TA 打球</button>`}

/* ---------- 发起 / 改时间：共用一张表单 ---------- */
let IVF=null;
function newInvite(to){const why=canInvite(to);if(why){toast(why);return}
  let o=1;while(o<6&&dayAt(o).getDay()!==6)o++;       // 默认最近的周六
  const mine=ME.home_club_ids||[];
  IVF={kind:'new',to,o,t:'09:00',e:'10:30',dur:90,per:0,venue_id:mine[0]||null,extra:null,search:!mine.length,q:'',game_type:'singles',note:'',hint:''};
  if(!lastTimeDefaults(IVF))strangerDefaults(IVF);drawInviteForm()}
/* 没一起打过：优先选你们共同所属的 Club，其次 TA 的主 Club；只用双方资料里已有的数据，不额外检索 */
function strangerDefaults(f){const u=U(f.to)||{},mine=ME.home_club_ids||[],theirs=u.home_club_ids||[],both=mine.find(v=>theirs.includes(v));f.stranger=true;
  if(both&&VEN[both]){f.venue_id=both;f.search=false;f.hint=`你们都是 ${venTxt(both)} 的会员，已选这里`}
  else if(theirs[0]&&VEN[theirs[0]]){f.venue_id=theirs[0];f.search=false;f.hint=`TA 的主 Club 是 ${venTxt(theirs[0])}，已选这里`}}
/* 打过球：按你们上一场的星期 / 时间 / 场地 / 玩法预填，一键就能发 */
function lastTimeDefaults(f){const last=gamesTogether(ME.id,f.to).filter(g=>new Date(g.starts_at)<NOW).sort((a,b)=>new Date(b.starts_at)-new Date(a.starts_at))[0];if(!last)return false;
  const s=new Date(last.starts_at),t=hm(s),wd=s.getDay();let o=null;for(let k=0;k<7;k++)if(dayAt(k).getDay()===wd&&dayAt(k,t)>NOW){o=k;break}
  if(o==null||perOf(t)<0)return false;f.o=o;f.t=t;f.per=perOf(t);f.dur=DURS.reduce((a,m)=>Math.abs(m-last.duration_min)<Math.abs(a-last.duration_min)?m:a,90);setEnd(f);
  if(VEN[last.venue_id])f.venue_id=last.venue_id;f.search=false;f.game_type=last.game_type==='rally'?'rally':'singles';
  f.hint=`已按你们上一场预填：${WD[wd]} ${t} · ${venTxt(last.venue_id)}`;return true}
function venueChoices(){const f=IVF,base=f.kind==='counter'?[...new Set([f.orig,...(ME.home_club_ids||[])])]:(ME.home_club_ids||[]);
  const list=[...base];if(f.venue_id&&!list.includes(f.venue_id))list.push(f.venue_id);return list}
function venueResults(){const o=U(IVF.to)||{};return vpList('iv',IVF,o.home_club_ids||[])}
function drawInviteForm(){const f=IVF,u=U(f.to),counter=f.kind==='counter',mine=ME.home_club_ids||[];
  const d0=firstFree(0)?0:1,days=Array.from({length:7-d0},(_,k)=>d0+k);   // 今天还来得及就从今天起，否则从明天起，共 7 天
  const P=PERIODS[f.per],slots=[];for(let m=P[1];m<=P[2];m+=30)slots.push(fromMin(m));
  const tag=v=>counter&&v===f.orig?'原地点':VEN[v]&&VEN[v].custom?'自己填写':VEN[v]?surfTxt(VEN[v]):'';
  INV_OPEN(`<div class="iv">
    <div class="iv-h"><span class="iv-av">${av(u)}</span><div><b>${counter?'换个时间给 '+esc(u.name):'约 '+esc(cardName(u))+' 打球'}</b><small>${counter?'只能改一次，TA 确认后生成球局':'TA 接受后，就是你们俩的私人球局'}</small></div></div>
    ${f.stranger&&!counter?(()=>{const s=stats(f.to);return `<div class="iv-trust"><span>赴约率 <b>${s.played?Math.round(s.att*100)+'%':'—'}</b></span><span>好评 <b>${s.kudos}</b></span><span>打过 <b>${s.played}</b> 场</span></div>`})():''}
    ${f.hint&&!counter?`<div class="iv-hint2">${esc(f.hint)}</div>`:''}
    <div class="iv-l">哪天</div>
    <div class="iv-days">${days.map(o=>{const d=dayAt(o);return `<button data-iv="day" data-v="${o}" class="${f.o===o?'on':''}"><small>${o===0?'今天':o===1?'明天':WD[d.getDay()]}</small><b>${d.getDate()}</b></button>`}).join('')}</div>
    <div class="iv-l">几点开始</div>
    <div class="iv-tp"><div class="iv-per">${PERIODS.map((p,k)=>`<button data-iv="per" data-v="${k}" class="${f.per===k?'on':''}">${p[0]}${perOf(f.t)===k?'<i></i>':''}</button>`).join('')}</div>
      <div class="iv-slots">${slots.map(t=>{const off=dayAt(f.o,t)<=NOW;return `<button data-iv="tm" data-v="${t}" class="${f.t===t?'on':''}" ${off?'disabled':''}>${t}</button>`}).join('')}</div></div>
    <div class="iv-l">打多久</div>
    <div class="iv-seg">${DURS.map(m=>`<button data-iv="dur" data-v="${m}" class="${f.dur===m?'on':''}">${durLbl(m)}</button>`).join('')}</div>
    <div class="iv-sum"><b>${esc(dayTxt(f.o))}</b><span>${f.t} – ${f.e}</span></div>
    <div class="iv-l">在哪打</div>
    <div class="iv-chips">${venueChoices().map(v=>`<button data-iv="ven" data-v="${v}" class="${f.venue_id===v?'on':''}">${esc(venTxt(v))}<small>${tag(v)}</small></button>`).join('')}<button data-iv="more" class="${f.search?'on2':''}">其他场地</button></div>
    ${f.search||f.adding?vpHTML('iv',f):''}
    ${counter?'':`<div class="iv-l">玩法</div>
    <div class="iv-seg">${['singles','rally'].map(k=>`<button data-iv="type" data-v="${k}" class="${f.game_type===k?'on':''}">${TYPE[k]}</button>`).join('')}</div>
    <div class="iv-l">说一句 <span>选填</span></div>
    <input id="ivNote" class="iv-in" maxlength="30" placeholder="比如：上次双打很开心，想约你单挑一局" value="${esc(f.note)}">`}
    ${f.stranger&&!counter?`<p class="iv-safe">第一次约 TA：建议选有人的公共球场，见面前在聊天里确认一下 · <a data-a="safety">安全须知</a></p>`:''}
    <button class="iv-go" data-iv="${counter?'sendCounter':'send'}">${counter?'发回给 TA 确认':'发送邀约'}</button>
    ${counter?'<button class="iv-3" data-iv="back" style="width:100%;margin-top:8px">返回</button>':`<div class="iv-foot">48 小时内有效 · 不会显示在发现页</div>`}</div>`);
  const d=document.querySelector('.iv-days .on');if(d)d.scrollIntoView({block:'nearest',inline:'center'})}
function keepForm(){if(!IVF)return;const n=document.getElementById('ivNote');if(n)IVF.note=n.value;const q=document.getElementById('ivQ');if(q)IVF.q=q.value;vpKeep('iv',IVF)}
function formOK(){const f=IVF;if(!f.venue_id){toast('选一个场地吧');return false}
  if(dayAt(f.o,f.t)<=NOW){toast('这个时间已经过了');return false}if(toMin(f.e)<=toMin(f.t)){toast('结束时间要晚于开始时间');return false}return true}
function sendInvite(){keepForm();if(!formOK())return;const f=IVF;
  const inv={id:++NID,from:ME.id,to:f.to,o:f.o,t:f.t,e:f.e,venue_id:f.venue_id,game_type:f.game_type,note:f.note.trim().slice(0,30),status:'pending',at:Date.now(),countered:false};
  if(lessHas(ME.id,f.to))setOpin(ME.id,f.to,'ok',null);   // 主动约 TA，说明不再想少遇到
  INVITES.unshift(inv);notifyInv(f.to,'invite',inv,ME.id);IVF=null;
  INV_OPEN(`<div class="iv iv-done"><div class="iv-ok">✓</div><b>邀约已发送</b><p>${esc(cardName(U(inv.to)))} 回复后会通知你<br>${esc(invWhen(inv))} · ${esc(invWhere(inv))}</p><button class="iv-go" data-iv="close">好的</button></div>`)}
function customVenue(name){name=name.trim().slice(0,40);if(!name)return null;
  const hit=Object.values(VEN).find(v=>v.name.toLowerCase()===name.toLowerCase());if(hit)return hit.id;
  const base=VEN[invHome(ME)]||VEN.v1,id='c'+(++NID);
  VEN[id]={id,name,short:name,suburb:'自填场地',lat:base.lat,lng:base.lng,surface:'hard',custom:true};return id}

/* ---------- 查看 / 回复邀约 ---------- */
let IVP=null;
function openInvite(id){const i=invOf(id);if(!i)return;IVP={id:i.id};IVF=null;drawInvite()}
function drawInvite(){const i=invOf(IVP.id),me=ME&&ME.id,exp=invExpired(i),incoming=!exp&&(i.status==='pending'?i.to===me:i.status==='counter'?i.from===me:false);
  const other=U(i.from===me?i.to:i.from);
  const stTxt=exp?'已失效':{pending:i.from===me?'等 TA 回复':'待你回复',counter:i.from===me?'TA 提议了新时间，待你确认':'等 TA 确认新时间',accepted:(()=>{const g=i.game_id&&GAMES.find(x=>x.id===i.game_id);return g&&new Date(g.starts_at)<=NOW?'已经一起打过了':'已确认 · 已生成私人球局'})(),declined:i.from===me?ivNoText(i):'你已婉拒',withdrawn:i.from===me?'你已撤回':'TA 撤回了邀约',expired:'已失效'}[i.status];
  const p=invCur(i);
  INV_OPEN(`<div class="iv"><div class="iv-card"><div class="iv-card-h"><span class="iv-av">${av(U(i.from))}</span><div><b>${i.status==='accepted'?`你和 ${esc(other.name)} 约好了`:`${esc(U(i.from).name)} 想约${i.from===me?' '+esc(other.name)+' ':'你'}打球`}</b><small>${stTxt}</small></div></div>
    ${i.status==='counter'?`<div class="iv-was">原定 ${esc(dayTxt(i.o))} ${i.t}–${i.e} · ${esc(venTxt(i.venue_id))}</div>`:''}
    <div class="iv-kv"><span>时间</span><b>${esc(invWhen(i))}</b></div><div class="iv-kv"><span>地点</span><b>${esc(invWhere(i))}</b></div><div class="iv-kv"><span>玩法</span><b>${TYPE[i.game_type]} · ${durTxt(p.t,p.e)}</b></div>
    ${i.note?`<div class="iv-note">“${esc(i.note)}”</div>`:''}</div>
    ${incoming?`<div class="iv-acts"><button class="iv-go" data-iv="accept">${i.status==='counter'?'就这个时间':'接受'}</button>${i.status==='pending'&&!i.countered?'<button class="iv-2" data-iv="counter">换个时间</button>':''}<button class="iv-3" data-iv="decline">婉拒</button></div>`
      :invNext(i,exp,other)}</div>`)}
/* 邀约的每一种状态都给出下一步，不留死胡同 */
function invNext(i,exp,other){const me=ME.id,mine=i.from===me,g=i.game_id&&GAMES.find(x=>x.id===i.game_id),first=esc(other.name.split(' ')[0]);
  const dm=`<button class="iv-2" data-cx="dm" data-u="${other.id}">发消息</button>`,close=`<button class="iv-3" data-iv="close">关闭</button>`;
  if(i.status==='accepted'&&g){const done=new Date(g.starts_at)<=NOW;
    return `<button class="iv-go" data-iv="game">查看球局</button><div class="iv-acts">${dm}${done?close:`<button class="iv-2" data-a="ics" data-g="${g.id}">加入日历</button>`}</div>
      <div class="iv-foot">${done?'打完了？去球局里给 TA 留个印象':'球局只有你们两人可见 · 有变化在球局聊天里说'}</div>`}
  if(exp)return `${mine?`<div class="iv-foot" style="margin:14px 0 4px">${first} 没有在 48 小时内回复，邀约已失效</div>`:''}<div class="iv-acts">${mine?`<button class="iv-2" data-iv="again">再约一次</button>`:dm}${close}</div>`;
  if(i.status==='declined')return `<div class="iv-acts">${mine?`<button class="iv-2" data-iv="again">换个时间再约</button>`:dm}${close}</div>`;
  if(i.status==='withdrawn')return `<div class="iv-acts">${mine?`<button class="iv-2" data-iv="again">重新约 ${first}</button>`:dm}${close}</div>`;
  // 我发出的、等对方回复（或我提议了新时间、等对方确认）
  const left=Math.max(1,Math.ceil((48*36e5-(Date.now()-i.at))/36e5));
  return `<div class="iv-foot" style="margin:14px 0 4px">${first} 回复后会通知你 · 还有 ${left} 小时有效</div><div class="iv-acts">${dm}<button class="iv-3" data-iv="withdraw">${mine?'撤回邀约':'撤回新时间'}</button></div>`}
function makeGame(i){const p=invCur(i),a=U(i.from),b=U(i.to),id='p'+(++NID);
  GAMES.push({id,share_code:Math.random().toString(36).slice(2,6),starts_at:dayAt(p.o,p.t).toISOString(),duration_min:toMin(p.e)-toMin(p.t),venue_id:p.venue_id,game_type:i.game_type,ntrp_min:Math.min(a.ntrp,b.ntrp),ntrp_max:Math.max(a.ntrp,b.ntrp),host_id:i.from,capacity:2,note:i.note||'',status:'full',visibility:'private',wx:{}});
  PARTS.push({game_id:id,user_id:i.from,role:'host',status:'approved',message:'',created_at:Date.now()},{game_id:id,user_id:i.to,role:'player',status:'approved',message:'',created_at:Date.now()});return id}
function finishAccept(i){const id=makeGame(i);i.status='accepted';i.game_id=id;const other=i.from===ME.id?i.to:i.from;
  notifyInv(other,'invite_accepted',i,ME.id);INV_CLOSE();toast('已生成私人球局 🎾');INV_RENDER();setTimeout(()=>INV_GAME(id),300)}
function invAct(act,el){const i=IVP&&invOf(IVP.id);
  if(IVF&&['pickVen','addVen','addCancel','addSurf','addSave','vpLetter','pickPlace','auPick'].includes(act)){keepForm();if(vpAct(IVF,act,el))drawInviteForm();return}
  switch(act){
    case'close':IVF=null;INV_CLOSE();break;
    case'day':keepForm();IVF.o=+el.dataset.v;if(dayAt(IVF.o,IVF.t)<=NOW){const t=firstFree(IVF.o);if(t){IVF.t=t;IVF.per=perOf(t);setEnd(IVF)}}drawInviteForm();break;
    case'per':keepForm();IVF.per=+el.dataset.v;drawInviteForm();break;
    case'tm':keepForm();IVF.t=el.dataset.v;setEnd(IVF);drawInviteForm();break;
    case'dur':keepForm();IVF.dur=+el.dataset.v;setEnd(IVF);drawInviteForm();break;
    case'ven':keepForm();IVF.venue_id=el.dataset.v;drawInviteForm();break;
    case'more':keepForm();IVF.search=!IVF.search;IVF.adding=null;IVF.q='';drawInviteForm();break;
    case'customVen':keepForm();{const id=customVenue(IVF.q);if(id){IVF.venue_id=id;IVF.q='';IVF.search=false}}drawInviteForm();break;
    case'type':keepForm();IVF.game_type=el.dataset.v;drawInviteForm();break;
    case'send':sendInvite();break;
    case'accept':finishAccept(i);break;
    case'counter':IVF={kind:'counter',to:i.from,o:i.o,t:i.t,e:i.e,dur:toMin(i.e)-toMin(i.t),per:Math.max(0,perOf(i.t)),venue_id:i.venue_id,orig:i.venue_id,search:false,q:'',game_type:i.game_type,note:''};drawInviteForm();break;
    case'back':IVF=null;drawInvite();break;
    case'sendCounter':keepForm();if(!formOK())return;{const f=IVF;if(f.o===i.o&&f.t===i.t&&f.e===i.e&&f.venue_id===i.venue_id){toast('时间和地点都没变，直接接受就好');return}
      i.counter={o:f.o,t:f.t,e:f.e,venue_id:f.venue_id};i.status='counter';i.countered=true;i.at=Date.now();IVF=null;notifyInv(i.from,'invite_counter',i,i.to);INV_CLOSE();toast('已发回给对方确认');INV_RENDER()}break;
    case'decline':drawInvNo(i);break;
    case'noBack':drawInvite();break;
    case'noGo':{const oth=i.from===ME.id?i.to:i.from,nt=((document.getElementById('ivNote')||{}).value||'').trim().slice(0,30);i.status='declined';i.no=el.dataset.v;i.noNote=nt;notifyInv(oth,'invite_declined',i,ME.id);INV_CLOSE();toast('已婉拒');INV_RENDER()}break;
    case'game':INV_CLOSE();INV_GAME(i.game_id);break;
    case'withdraw':if(i.status==='counter'&&i.to===ME.id){i.status='pending';i.counter=null;toast('已撤回新时间');drawInvite()}else{i.status='withdrawn';toast('已撤回');INV_CLOSE()}INV_RENDER();break;
    case'again':{const to=i.from===ME.id?i.to:i.from;INV_CLOSE();setTimeout(()=>newInvite(to),120)}break;
  }}

/* ---------- 婉拒邀约：和婉拒申请同一套做法 —— 选一句真实的理由，可以再加一句自己的话；时间不合适就直接「换个时间」 ---------- */
const IVNO=[['week','这周排满了','这周排满了，下次再约 🎾'],['rest','最近在休息','最近在休息，暂时不约球'],['pass','这次先不约了','谢谢邀请，这次先不约啦']];
function ivNoText(i){const x=IVNO.find(x=>x[0]===i.no);return (x?x[2]:'这次先不约啦')+(i.noNote?` · 「${i.noNote}」`:'')}
function drawInvNo(i){const u=U(i.from===ME.id?i.to:i.from);
  INV_OPEN(`<div class="iv softno"><div class="sn-h">婉拒 ${esc(u.name.split(' ')[0])} 的邀约</div>
    <input class="sn-note" id="ivNote" maxlength="30" placeholder="想对 TA 说一句？（可选）">
    <div class="sn-list">${IVNO.map(([k,a,b])=>`<button data-iv="noGo" data-v="${k}"><b>${a}</b><small>TA 会看到：「${b}」</small></button>`).join('')}</div>
    ${i.status==='pending'&&!i.countered?`<button class="iv-2" data-iv="counter" style="width:100%;margin-top:10px">只是时间不合适？换个时间</button>`:''}
    <button class="mt-sec" data-iv="noBack" style="display:block;margin:8px auto 0;border:0;background:none;font:inherit;color:var(--mut)">返回</button></div>`)}

/* ---------- 私人球局：互相展示微信号（默认关闭，双方都打开才可见） ---------- */
function privHTML(c){if(c.visibility!=='private')return'';const me=ME&&c.appr.some(p=>p.user_id===ME.id);
  const wx=c.wx||{},other=c.appr.map(p=>U(p.user_id)).find(u=>!ME||u.id!==ME.id),both=ME&&other&&wx[ME.id]&&wx[other.id];
  return `<div class="priv"><div class="priv-h">🔒 私人球局 · 只有你们两人可见，不出现在发现页</div>
    ${me?`<div class="priv-row"><span>向对方展示我的微信号</span><button class="tg ${wx[ME.id]?'on':''}" data-iv="wx" data-g="${c.id}"></button></div>
    ${wx[ME.id]&&!ME.wechat?`<div class="priv-row"><input id="wxId" class="iv-in" placeholder="你的微信号" style="margin:0"><button class="iv-2" data-iv="wxSave" data-g="${c.id}" style="flex:none;padding:0 14px">保存</button></div>`:''}
    <div class="priv-s">${both?`微信：${esc(ME.name)} <b>${esc(ME.wechat)}</b> · ${esc(other.name)} <b>${esc(other.wechat||'')}</b>`:wx[ME.id]?'等对方也打开后，双方互相可见':'默认关闭。双方都打开后才会互相显示'}</div>`:''}</div>`}
function wxToggle(gid){const g=GAMES.find(x=>x.id===gid);g.wx=g.wx||{};g.wx[ME.id]=!g.wx[ME.id];INV_RENDER()}

document.addEventListener('click',e=>{const el=e.target.closest('[data-iv]');if(!el)return;e.stopPropagation();const a=el.dataset.iv;

function journey(u,s){const b=u.base||{},imp=impOf(u),ns=b.noshow||0,late=b.late||0,rep=b.reports||0,done=s.played;
  s.kudos=Object.values(imp).reduce((a,c)=>a+c,0);s.att=done+ns?done/(done+ns):1;s.late=late;s.noshow=ns;
  const cl=x=>Math.max(0,Math.min(100,x));
  const P=cl(22*Math.log(1+done)+4*Math.min(s.streak,8));                                   // 参与：完成的球局、持续每周来
  const T=done<3&&!ns?70:cl(40+60*s.att-15*ns-6*late-30*rep);                               // 可信：赴约率、爽约、临时退出、被核实的举报
  const K=cl(35+90*Math.min(s.kudos/Math.max(done,1),.7)+((imp.newbie||0)>2?5:0)-25*rep);    // 友善：收到的印象、被举报
  const C=cl(12*Math.log(1+s.hosted*2)+8*s.invites+((u.home_club_ids||[]).length?6:0)+(u.last?4:0)); // 贡献：组织球局、带新朋友、完善资料

/* ===================== 消息：球局群聊 + 球友私信 =====================
 * 只有同一局里已确认的人能进球局群聊；私信只限「一起打过球 / 同在一局 / 接受过邀约」的球友，陌生人没有入口
 * 不显示手机号、不发图片和链接；屏蔽后双方都看不到对方的消息；每条消息都可以举报
 */
var THREADS=[],MSGS=[],LASTREAD={},CXCUR=null;
const QUICK=['我到了','晚到 10 分钟','晚到 20 分钟','下雨了，还打吗？','我带球','谢谢，下次再约！'];
const gMembers=gid=>PARTS.filter(p=>p.game_id===gid&&p.status==='approved').map(p=>p.user_id);
const cxOther=t=>t.members.find(x=>x!==ME.id);
function cxMember(t,uid){return t.type==='game'?gMembers(t.game_id).includes(uid):t.members.includes(uid)}
function canDM(uid){if(!ME||uid===ME.id||blockedPair(ME.id,uid))return false;
  return gamesTogether(ME.id,uid).length>0||INVITES.some(i=>[i.from,i.to].includes(uid)&&[i.from,i.to].includes(ME.id)&&['pending','counter','accepted'].includes(i.status))}
function dmThread(uid,create){let t=THREADS.find(t=>t.type==='dm'&&t.members.includes(ME.id)&&t.members.includes(uid));if(!t&&create){t={id:'t'+(++NID),type:'dm',members:[ME.id,uid]};THREADS.push(t)}return t}
function gameThread(gid,create){let t=THREADS.find(t=>t.type==='game'&&t.game_id===gid);if(!t&&create){t={id:'t'+(++NID),type:'game',game_id:gid};THREADS.push(t)}return t}
const tMsgs=t=>MSGS.filter(m=>m.tid===t.id&&!(ME&&blockedPair(ME.id,m.from)));
const lastMsg=t=>{const l=tMsgs(t);return l[l.length-1]};
function cxUnread(t){const lr=LASTREAD[ME.id+'|'+t.id]||0;return tMsgs(t).filter(m=>m.from!==ME.id&&m.at>lr).length}
function myThreads(){if(!ME)return[];return THREADS.filter(t=>cxMember(t,ME.id)&&lastMsg(t)&&!(t.type==='dm'&&blockedPair(ME.id,cxOther(t)))).sort((a,b)=>lastMsg(b).at-lastMsg(a).at)}
const chatUnread=()=>myThreads().reduce((a,t)=>a+cxUnread(t),0);
function gameClosed(t){if(t.type!=='game')return false;const g=GAMES.find(x=>x.id===t.game_id);return !g||g.status==='cancelled'||+new Date(g.starts_at)+g.duration_min*6e4+48*36e5<Date.now()}
function cxTitle(t){if(t.type==='dm')return U(cxOther(t)).name;const c=V(GAMES.find(g=>g.id===t.game_id));return `${relDay(c.start)} ${hm(c.start)} · ${c.v.short}`}
function cxAv(t){return t.type==='dm'?av(U(cxOther(t))):`<span class="av cx-gav"><svg viewBox="0 0 100 100"><use href="#ball"/></svg></span>`}
const cxTime=at=>{const d=new Date(at),o=dOff(d);return o===0?hm(d):o===-1?'昨天':`${d.getMonth()+1}/${d.getDate()}`};

function inboxHTML(){const L=myThreads();
  if(!L.length)return `<div class="empty"><b>还没有消息</b>和球友一起打过球之后，可以在球员卡上发消息<br>加入球局后，也可以在球局里聊天</div>`;
  return `<div class="cx-list">${L.map(t=>{const m=lastMsg(t),n=cxUnread(t);return `<button class="cx-item${CXCUR===t.id?' on':''}" data-cx="open" data-t="${t.id}">${cxAv(t)}<span class="cx-mid"><b>${esc(cxTitle(t))}</b><span>${t.type==='game'&&m.from!==ME.id?esc(U(m.from).name.split(' ')[0])+'：':''}${esc(m.text)}</span></span><span class="cx-r"><small>${cxTime(m.at)}</small>${n?`<i>${n}</i>`:''}</span></button>`}).join('')}</div>`}
function threadHTML(t){const ms=tMsgs(t),closed=gameClosed(t),other=t.type==='dm'?U(cxOther(t)):null;
  const sub=t.type==='dm'?`一起打过 ${playedCount(ME.id,other.id)} 场`:`${gMembers(t.game_id).length} 人 · 球局聊天`;
  let last=0,h='';ms.forEach(m=>{if(m.at-last>30*6e4)h+=`<div class="cx-ts">${cxTime(m.at)}${dOff(new Date(m.at))===0?'':' '+hm(new Date(m.at))}</div>`;last=m.at;const me=m.from===ME.id,u=U(m.from);
    h+=`<div class="cx-m${me?' me':''}">${me?'':`<span data-user="${u.id}">${av(u,'sm')}</span>`}<div>${!me&&t.type==='game'?`<small>${esc(u.name.split(' ')[0])}</small>`:''}<p>${esc(m.text)}</p></div></div>`});
  return `<div class="cx-th"><div class="cx-hd">${CX_BACK?`<button class="cx-back" data-cx="inbox">‹</button>`:''}${cxAv(t)}<div><b>${esc(cxTitle(t))}</b><small>${sub}</small></div>${t.type==='game'?`<button class="cx-link" data-cx="toGame" data-g="${t.game_id}">球局</button>`:`<button class="cx-link" data-user="${other.id}">球员卡</button>`}</div>
    <div class="cx-msgs" id="cxMsgs">${h||`<div class="cx-ts">${t.type==='game'?'和同局球友打个招呼吧':'说点什么吧'}</div>`}</div>
    ${closed?`<div class="cx-closed">球局已结束，聊天已关闭</div>`:`<div class="cx-quick">${QUICK.map(q=>`<button data-cx="quick" data-v="${q}">${q}</button>`).join('')}</div>
    <div class="cx-in"><input id="cxIn" maxlength="200" placeholder="${t.type==='game'?'发给同局球友':'发消息给 '+esc(other.name.split(' ')[0])}" autocomplete="off"><button data-cx="send">发送</button></div>
    <div class="cx-foot">不会显示你的手机号 · 只能发文字 · <a data-cx="report">举报</a></div>`}</div>`}
function openThread(tid){CXCUR=tid;const t=THREADS.find(x=>x.id===tid);LASTREAD[ME.id+'|'+tid]=Date.now();CX_SHOW(t);INV_RENDER();
  setTimeout(()=>{const b=document.getElementById('cxMsgs');if(b)b.scrollTop=b.scrollHeight},30)}
function cxSend(text){text=String(text||'').trim().slice(0,200);if(!text)return;if(/https?:\/\/|www\./i.test(text)){toast('暂不支持发送链接');return}
  const t=THREADS.find(x=>x.id===CXCUR);MSGS.push({tid:t.id,from:ME.id,text,at:Date.now()});LASTREAD[ME.id+'|'+t.id]=Date.now();openThread(t.id);
  if(t.type==='dm'){const o=cxOther(t);setTimeout(()=>{MSGS.push({tid:t.id,from:o,text:/晚到/.test(text)?'没事，慢慢来，我先热身 👌':/到了/.test(text)?'我也快到了！':'好的 👌',at:Date.now()});
    if(CXCUR===t.id&&document.getElementById('cxMsgs'))openThread(t.id);else{INV_RENDER();nrChat(t,lastMsg(t),()=>INV_BANNER(U(o).name,lastMsg(t).text,()=>openThread(t.id)))}},1600)}}
function chatBtnHTML(uid){if(!canDM(uid))return'';const t=dmThread(uid),n=t?cxUnread(t):0;return `<button class="kdb cxbtn" data-cx="dm" data-u="${uid}">💬 发消息${n?` · ${n} 条未读`:''}</button>`}
function chatGameBtn(c,st){if(!ME||!['approved','host'].includes(st)||c.appr.length<2)return'';const t=gameThread(c.id),n=t?cxUnread(t):0;
  return `<button class="${SX_BTN.s} cxgame" data-cx="game" data-g="${c.id}">💬 球局聊天${n?` · ${n} 条未读`:''}</button>`}
document.addEventListener('click',e=>{const el=e.target.closest('[data-cx]');if(!el)return;e.stopPropagation();const a=el.dataset.cx,d=el.dataset;
  if(!ME&&a!=='inbox'){toast('请先登录');return}
  switch(a){
    case'inbox':CXCUR=null;CX_INBOX();break;
    case'open':openThread(d.t);break;
    case'dm':openThread(dmThread(d.u,true).id);break;
    case'game':openThread(gameThread(d.g,true).id);break;
    case'quick':cxSend(d.v);break;
    case'send':{const i=document.getElementById('cxIn');cxSend(i&&i.value);break}
    case'toGame':CX_CLOSE();INV_GAME(d.g);break;
    case'report':toast('已收到举报，我们会尽快核实');break;
  }},true);
document.addEventListener('keydown',e=>{if(e.target.id==='cxIn'&&e.key==='Enter'){e.preventDefault();cxSend(e.target.value)}});
function seedChat(){THREADS=[];MSGS=[];LASTREAD={};CXCUR=null;const now=Date.now();
  const g=gameThread('g6',true),dm={id:'t1',type:'dm',members:['han','jason']};THREADS.push(dm);
  MSGS.push({tid:g.id,from:'tom',text:'明天 9 点见，我订了 3 号场',at:now-5*36e5},{tid:g.id,from:'grace',text:'好的👌 我带一筒新球',at:now-4.6*36e5},{tid:g.id,from:'jason',text:'收到，8:50 到',at:now-4.2*36e5},{tid:g.id,from:'tom',text:'明天可能有小雨，早上我看一下再说',at:now-40*6e4});
  MSGS.push({tid:'t1',from:'han',text:'周三双打打得很开心！',at:now-26*36e5},{tid:'t1',from:'jason',text:'我也是，你的网前太稳了',at:now-25.5*36e5},{tid:'t1',from:'han',text:'这周六上午有空吗？想再约一局单打',at:now-2*36e5});
  LASTREAD['jason|'+g.id]=now-4.2*36e5}
document.addEventListener('click',e=>{const b=e.target.closest('[data-cx2]');if(!b)return;e.stopPropagation();UI.msgTab=b.dataset.cx2;INV_RENDER()},true);

/* ===================== 埋点 v2 · 核心 =====================
 * 事件字典：events_spec.md（唯一来源）。两端同名同 props；业务事件见下方「埋点 v2 · 业务事件」。
 * 公共字段：ev, at, uid, anon, sid, device(mobile|desktop，按设备推断), build(pwa|web，哪个文件), env, os, scr, props
 * 会话：localStorage 记最后活动时间，30 分钟无活动换新 sid 并先发 session_start；session_start 在身份恢复之后发
 * 隐私：只记「做了什么」，不记聊天内容、手机号、精确位置、性别值；「使用数据」关闭后不发任何事件（含未登录访客、session_start）
 *       登录后以账号设置为准（users.analytics_opt_out，服务端事件也遵守）
 * 传输：前端攒批，每 10 秒或页面切到后台时 sendBeacon 到 /api/events；服务端补 IP→区域（只到 suburb）、UA 解析
 */
const AN_BUILD='pwa',AN_IDLE=30*6e4;
const anLS=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const anSS=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const anId=p=>p+Math.random().toString(36).slice(2,12)+Date.now().toString(36).slice(-4);
const AN={q:[],sent:0,pre:[],ready:false,sid:null,last:0,ctx:'list',pv:null,overlay:null,cardAt:{},
  anon:anLS('nbq_anon')||(()=>{const a=anId('a_');anSS('nbq_anon',a);return a})(),
  off:anLS('nbq_analytics_off')==='1',
  // 地址栏参数：分享（s / f）、广告（utm_*）、主屏幕（source）、推送（n / k）；hash 路由里的参数也读
  qp:(()=>{const o={};try{const h=location.hash.indexOf('?');[new URLSearchParams(location.search),new URLSearchParams(h>=0?location.hash.slice(h+1):'')].forEach(p=>p.forEach((v,k)=>{if(v&&o[k]==null)o[k]=v}))}catch(e){}return o})()};
// 分享出去的链接都带上来源：?s=渠道&f=分享人编号 —— 站外回流能精确算到「哪种分享、谁分享的」
// 渠道：link 复制链接 / text 复制文案 / sys 系统分享 / xhs 小红书 / moments 朋友圈 / qr 图片上的二维码 / webqr 电脑端扫码
function shareURL(url,ch){if(!ch)return url;let q='s='+ch;try{if(typeof ME!=='undefined'&&ME&&ME.no!=null)q+='&f='+(typeof fmtNo==='function'?fmtNo(ME.no):ME.no)}catch(e){}return url+(url.includes('?')?'&':'?')+q}
// 进入方式：推送（?n=&k=）· 站外分享（带 s=）· 外部来源 · 直接（输入网址 / 收藏 / 主屏幕）
AN.entry=AN.qp.n||AN.qp.k?'push':AN.qp.s?'share':(document.referrer&&!/nanbanqiu\.com/.test(document.referrer))?'external':'direct';

// 使用环境：比「手机 / 电脑」更细，知道用户到底在哪打开（主屏幕、微信、小红书、Safari……）
// env：pwa_ios / pwa_android 主屏幕 · wechat 微信内 · xhs 小红书内 · ig_fb · safari_ios · chrome_ios · chrome_android · samsung · mobile_other ·
//      desk_chrome / desk_safari / desk_edge / desk_firefox / desk_other 电脑
// device：按 UA 推断；UA 看不出来时，触屏且屏幕窄（< 600）也算手机
const AENV=(()=>{const ua=navigator.userAgent||'',sa=!!((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone),
  ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1),and=/Android/.test(ua);
  let mob=ios||and||/Mobile/.test(ua);try{if(!mob&&window.matchMedia&&matchMedia('(pointer: coarse)').matches&&Math.min(screen.width,screen.height)<600)mob=true}catch(e){}
  let env;if(/MicroMessenger/i.test(ua))env='wechat';else if(/xhsdiscover|XiaoHongShu/i.test(ua))env='xhs';else if(/Instagram|FBAN|FBAV/i.test(ua))env='ig_fb';
  else if(sa)env=ios?'pwa_ios':'pwa_android';else if(mob){env=ios?(/CriOS/.test(ua)?'chrome_ios':/FxiOS|EdgiOS/.test(ua)?'mobile_other':'safari_ios'):/SamsungBrowser/.test(ua)?'samsung':/Chrome/.test(ua)?'chrome_android':'mobile_other'}
  else env=/Edg\//.test(ua)?'desk_edge':/Firefox/.test(ua)?'desk_firefox':/Chrome/.test(ua)?'desk_chrome':/Safari/.test(ua)?'desk_safari':'desk_other';
  return {env,device:mob?'mobile':'desktop',os:ios?'ios':and?'android':/Mac/.test(ua)?'macos':/Windows/.test(ua)?'windows':'other',standalone:sa}})();

function track(ev,props){if(AN.off)return;const now=Date.now();
  if(AN.ready&&AN.last&&now-AN.last>AN_IDLE)anSession('direct');          // 30 分钟没有活动：新会话
  AN.last=now;anSS('nbq_last',String(now));
  const e={ev,at:new Date(now).toISOString(),uid:typeof ME!=='undefined'&&ME?ME.id:null,anon:AN.anon,sid:AN.sid,device:AENV.device,build:AN_BUILD,env:AENV.env,os:AENV.os,city:CITY.key,scr:AN.pv?AN.pv.screen:'',props:props||{}};
  if(!AN.ready){AN.pre.push(e);return}anPush(e)}
function anPush(e){AN.q.push(e);if(window.AN_LOG)window.AN_LOG.push(e);if(AN.q.length>=30)anFlush()}
function anFlush(){if(!AN.q.length)return;const batch=AN.q.splice(0);AN.sent+=batch.length;
  try{if(/^https?:/.test(location.protocol)&&navigator.sendBeacon)navigator.sendBeacon('/api/events',new Blob([JSON.stringify({v:2,events:batch})],{type:'application/json'}));else if(window.AN_DEBUG)console.debug('[track]',batch)}catch(e){}}
// 新会话：换 sid，先发 session_start（第一次带上进入方式、落地页和来源参数）
function anSession(entry,first){AN.sid=anId('s_');anSS('nbq_sid',AN.sid);AN.last=Date.now();anSS('nbq_last',String(AN.last));if(entry)AN.entry=entry;if(AN.off)return;
  const q=first?AN.qp:{},p={entry:AN.entry,ref:first&&document.referrer?(()=>{try{return new URL(document.referrer).hostname}catch(e){return''}})():(q.ref||''),landing:location.pathname+location.hash,
    utm_source:q.utm_source||null,utm_medium:q.utm_medium||null,utm_campaign:q.utm_campaign||null,s:q.s||null,f:q.f||null,source:q.source||null,
    standalone:AENV.standalone,lang:navigator.language,vw:innerWidth};
  anPush({ev:'session_start',at:new Date().toISOString(),uid:typeof ME!=='undefined'&&ME?ME.id:null,anon:AN.anon,sid:AN.sid,device:AENV.device,build:AN_BUILD,env:AENV.env,os:AENV.os,city:CITY.key,scr:AN.pv?AN.pv.screen:'',props:p})}
// 退出登录：换新 anon 和会话，避免同一台设备上的两个人被并成一个人
function anNewAnon(){anFlush();AN.anon=anId('a_');anSS('nbq_anon',AN.anon);anSession('direct')}
setInterval(anFlush,10000);

// ---------- 页面：page_view / page_time ----------
// 底下的页面按状态算（PWA：发现 / 我的球局 / 消息 / 我的 / 球局详情；网页：发现 / 我的球局 / 球局详情 / 分享落地页）；
// 盖在上面的面板（登录、发起、球员卡、分享、筛选……）打开时记成单独的页面，关掉后回到底下的页面
function anPage(screen){if(!screen)return;const now=Date.now();if(AN.pv&&AN.pv.screen===screen)return;
  if(AN.pv)track('page_time',{screen:AN.pv.screen,ms:now-AN.pv.t});AN.pv={screen,t:now};track('page_view',{screen,entry:AN.entry})}
function anBase(){if(typeof UI==='undefined')return'';if(AN_BUILD==='pwa')return UI.detail?'game_detail':UI.tab||'disc';return UI.landing?'landing':UI.sel?'game_detail':UI.tab||'disc'}
function anOverlayOn(){const on=id=>{const x=document.getElementById(id);return !!(x&&x.classList.contains('show'))};return AN.overlay==='notif'?on('pop'):on('sbg')||on('mbg')}
function anSync(){if(AN.overlay&&!anOverlayOn())AN.overlay=null;anPage(AN.overlay||anBase())}
function anOverlay(name){AN.overlay=name;anPage(name)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){if(AN.pv){track('page_time',{screen:AN.pv.screen,ms:Date.now()-AN.pv.t});AN.pv.t=Date.now()}track('app_hide');anFlush()}
  else{if(AN.pv)AN.pv.t=Date.now();track('app_show')}});
// 记录这次点击发生在哪块区域，用来区分「从列表 / 地图 / 消息 / 通知 / 球员卡 / 我的球局 / 详情」进入
addEventListener('click',e=>{const t=e.target;if(!t||!t.closest)return;AN.clickEl=t;
  AN.ctx=t.closest('.rc,.rc-p')?'recap':t.closest('.req,.rq-c')?'request':t.closest('#banner,#dn')?'notif':t.closest('.mapel,#mapView,#map,.mapbox,.vcs,.vpanel,[data-vc],[data-pin],.mcard')?'map'
    :t.closest('.cx-th,.cxsheet,.cx-list,.cx-m,.cx-web')?'chat':t.closest('#scr-notif,#pop,.ntf')?'notif':t.closest('.pc,[data-card],.kdb,.fp,.cardsheet,.invbtn,.pals')?'card'
    :t.closest('#scr-mine,.tl2,.ivq')?'mine':t.closest('#detail,.dpanel,#colR,.dp,.land')?'detail':'list'},true);
// 球员卡当前状态：只在看 / 改 / 分享自己的卡时带上（后台统计「最多人用的动物 / 印样 / 印色 / 卡面」）
const anCard=()=>{if(typeof ME==='undefined'||!ME)return{};return{animal:ME.avatar_kind==='animal'?ME.animal:'letter',seal:ME.avatar_kind==='animal'&&typeof sealOf==='function'?sealOf(ME):'bw-rd',seal_roll:ME.seal_roll||0,color:ME.color,theme:ME.card_theme||'court'}};
const anGame=id=>{try{const g=GAMES.find(x=>x.id===id);if(!g)return{game_id:id};return{game_id:id,venue_id:g.venue_id,type:g.game_type,utr:[g.ntrp_min,g.ntrp_max]}}catch(e){return{game_id:id}}};

// 添加到主屏幕：安卓 / 电脑 Chrome 有安装事件；iPhone 没有，用「第一次从主屏幕打开」判断
addEventListener('beforeinstallprompt',()=>track('pwa_install_prompt'));
addEventListener('appinstalled',()=>track('pwa_installed',{os:AENV.os}));
try{if(AENV.standalone&&!anLS('nbq_sa1')){anSS('nbq_sa1','1');track('pwa_first_launch',{os:AENV.os})}}catch(e){}

// ---------- 「使用数据」开关：未登录也能关（我的页、联系我们）；关了之后不再发任何事件 ----------
const AN_TXT='记录你怎么使用南伴球，用于改进产品；不含聊天内容、手机号和精确位置';
const anOffTxt=()=>`${AN.off?'已关闭':'已开启'} · ${AN_TXT}`;
const anPrivHTML=cls=>`<button class="${cls}" data-anx="1"><span class="ico" style="background:#5B7A6A"><svg><use href="#i-shield"/></svg></span><span class="v">使用数据<small data-anxs>${anOffTxt()}</small></span></button>`;
function anSetOff(off){if(off===AN.off)return;if(off){track('analytics_off');anFlush()}AN.off=off;anSS('nbq_analytics_off',off?'1':'0');
  if(typeof ME!=='undefined'&&ME)ME.analytics_opt_out=off;      // PATCH /api/me {analytics_opt_out} → users.analytics_opt_out
  if(!off){if(!AN.sid)anSession('direct');track('analytics_on')}document.querySelectorAll('[data-anxs]').forEach(s=>s.textContent=anOffTxt())}
// 登录 / 换账号：以账号上的设置为准；新账号沿用这台设备的选择
function anIdentity(){if(typeof ME==='undefined'||!ME)return;if(ME.analytics_opt_out==null){ME.analytics_opt_out=AN.off;return}

/* ===================== 修改球局 =====================
 * 保留「修改」，不用「取消再发」：取消重发会让已加入的人掉队、待审核的申请作废、微信群里的链接失效，发起人还背一次取消记录。
 * 按影响分两类：
 *   · 小改（水平、标签、备注、缺几人、公开设置）：直接保存，不打扰任何人
 *   · 大改（时间、时长、地点、玩法）：保存前列出改了什么、会通知谁；已加入的人收到通知，在球局页确认「还能来」或「来不了」，
 *     来不了直接退出，不算临时退出、不影响赴约率；待审核的申请保留，也会收到通知
 * 开打后不能改；已加入的人数超过新玩法的人数时不能改玩法。 */
function geOpen(id){const c=api.get(id);if(!c||!c.isHost||c.start<=NOW)return;
  if(typeof UI!=='undefined'&&UI.detail&&typeof closeSheet==='function')closeSheet();
  openCreate();const t=hm(c.start),o=dOff(c.start);
  Object.assign(NG,{edit:id,o,t,per:perOf(t),dur:c.duration_min,venue_id:c.venue_id,search:false,adding:null,q:'',type:c.game_type,miss:c.game_type==='doubles'?Math.max(1,c.spots):3,
    lv:'custom',mn:c.ntrp_min,mx:c.ntrp_max,tags:new Set(c.tags||[]),note:c.note||'',hide:!!c.hide_done,instant:c.join_mode==='instant',rep:false});drawCreate()}
const geWhen=(st,dur)=>`${relDay(st)} ${hm(st)}–${hm(new Date(+st+dur*6e4))}`;
function geDiff(c,f){const ns=dayAt(f.o,f.t),key=[],lite=[];
  if(+ns!==+c.start||f.dur!==c.duration_min)key.push(['时间',geWhen(c.start,c.duration_min),geWhen(ns,f.dur)]);
  if(f.venue_id!==c.venue_id)key.push(['地点',c.v.short,VEN[f.venue_id].short]);
  if(f.type!==c.game_type)key.push(['玩法',TYPE[c.game_type],TYPE[f.type]]);
  if(f.mn!==c.ntrp_min||f.mx!==c.ntrp_max)lite.push('水平');
  if([...f.tags].sort().join()!==[...(c.tags||[])].sort().join())lite.push('标签');
  if(f.note.trim()!==(c.note||''))lite.push('备注');
  if(!!f.hide!==!!c.hide_done)lite.push('公开设置');if(ugMode(f)!==(c.join_mode||'approve'))lite.push('加入方式');
  if(f.type==='doubles'&&c.game_type==='doubles'&&f.miss!==c.spots)lite.push('缺几人');
  return {key,lite,ns}}
function geSave(){ngKeep();const f=NG,c=api.get(f.edit);if(!c)return;
  if(!f.venue_id){toast('选一个场地吧');return}if(dayAt(f.o,f.t)<=NOW){toast('这个时间已经过了');return}
  const others=c.appr.filter(p=>p.user_id!==c.host_id).length+(c.filled||0);
  if(f.type!==c.game_type&&others+1>CAP[f.type]){toast(`已经有 ${others+1} 人，不能改成${TYPE[f.type]}`);return}
  if(f.type==='doubles'&&f.miss>CAP.doubles-1-others){f.miss=CAP.doubles-1-others}
  const d=geDiff(c,f);if(!d.key.length&&!d.lite.length){toast('没有改动');return}
  const aff=c.appr.filter(p=>p.user_id!==c.host_id),pend=c.pend;
  if(!d.key.length||!aff.length&&!pend.length){geApply(c,f,d);return}

  UF_OPEN(`<div class="uf ge"><div class="uf-h">保存修改？</div>
    <div class="ge-d">${d.key.map(x=>`<div><span>${x[0]}</span><s>${esc(x[1])}</s><b>${esc(x[2])}</b></div>`).join('')}</div>
    <p class="uf-s" style="margin:12px 0 14px">${aff.length?`${names} 会收到通知，可以确认还能来，或者直接退出（不算临时退出）。`:''}${pend.length?`${pend.length} 个待审核的申请会保留，也会收到通知。`:''}</p>
    <div class="uf-l"><button class="uf-r p" data-ge="go"><b>保存并通知</b></button><button class="uf-r" data-ge="back"><b>返回修改</b></button></div></div>`)}
function geApply(c,f,d){const g=GAMES.find(x=>x.id===c.id),lines=d.key.map(x=>`${x[0]}改为 ${x[2]}`);

  if(g.game_type==='doubles'){const ap=PARTS.filter(p=>p.game_id===g.id&&p.status==='approved').length;g.filled=Math.max(0,CAP.doubles-ap-f.miss)}else g.filled=0;
  g.ntrp_min=f.mn;g.ntrp_max=f.mx;g.tags=[...f.tags];g.note=f.note.trim().slice(0,60);g.hide_done=!!f.hide;
  if(d.key.some(x=>x[0]==='时间')){g.ufRemind=false;g.ufEnd=false;g.time_set_at=Date.now()}g.join_mode=ugMode(f);
  const sp=V(g).spots;g.status=sp<=0?'full':'open';
  let n=0;if(d.key.length)PARTS.filter(p=>p.game_id===g.id&&p.user_id!==g.host_id&&['approved','pending'].includes(p.status)).forEach(p=>{if(p.status==='approved'){p.chg={lines,ack:false};n++}

/* ===================== 临时约球（开场前 2 小时内） =====================

 *    计算：失效时间 = min( max(申请时间, 开场 − 60 分钟) + 15 分钟 , 开场 )

 *    · 临时退出：被确认（或直接加入）后 10 分钟内退出，不算临时退出 */

/* ===================== 打完之后：只关于自己的选择 · 不等任何人回应 =====================
 * 赛后卡片对每位同场球友选「多遇到 / 随缘 / 少遇到」，再选这局对你来说「偏难 / 刚好 / 偏轻松」。
 * 设计原则：这是你给自己的推荐做的设置，不是向对方发出的请求——
 *   · 没有「等对方回应」这一步，也没有「互相」才出现的东西，所以不会有期待落空、没回音的难受；
 *   · 任何选择都不通知对方，也不会让对方看到的页面有任何变化（少遇到的人看到的是「TA 暂时不接受邀约」，和对方关闭邀约时完全一样）。
 * 多遇到：TA 发的局在你的列表里靠前；TA 新发了适合你的局，告诉你一声（同一个人每周最多一次，22:00–08:00 顺延到早上）。
 * 少遇到：TA 发的局排在后面；TA 不能直接加入你的局（照常申请）、不能约你；TA 的消息不再提醒你。
 * 提醒：结束 1 小时后一条「打得怎么样」，只发一次；22:00–08:00 顺延到早上 8 点；超过 24 小时没送出就不发。卡片 7 天内可以改，之后在球员卡上改。 */
const RC_DELAY=36e5,RC_WINDOW=7*864e5,FG_GAP=7*864e5;
var OPIN={},AFTER={},RCQ=[],FG_LAST={},LESS_IV={};
const rcEnd=g=>+new Date(g.starts_at)+g.duration_min*6e4;
const rcQuiet=t=>nrQuiet(t);   // 夜间（城市当地时间，默认 22:00–08:00）顺延到早上 8 点，和通知用同一个 nrQuiet
const opinOf=(a,b)=>(OPIN[a+'>'+b]||{}).v||'ok';
const lessHas=(a,b)=>opinOf(a,b)==='less';
const followHas=(a,b)=>opinOf(a,b)==='more';
function setOpin(a,b,v,gid){const was=opinOf(a,b),now=Date.now(),iv=LESS_IV[a+'>'+b]=LESS_IV[a+'>'+b]||[];
  if(v==='ok')delete OPIN[a+'>'+b];else OPIN[a+'>'+b]={v,at:now,gid:gid||null};
  // 记下「少遇到」生效的时间段：只有这段时间里收到的私信不提醒；改回之后，之前静音的消息也不会突然冒出未读
  if(was!=='less'&&v==='less')iv.push([now,Infinity]);if(was==='less'&&v!=='less'&&iv.length)iv[iv.length-1][1]=now}
function rcOthers(g,uid){return PARTS.filter(p=>p.game_id===g.id&&p.status==='approved'&&p.user_id!==uid&&U(p.user_id)&&!blockedPair(uid,p.user_id)).map(p=>p.user_id)}
function rcEligible(g,uid,now=Date.now()){if(!g||!uid||g.status==='cancelled')return false;const e=rcEnd(g);if(e>now||now-e>RC_WINDOW)return false;
  return PARTS.some(p=>p.game_id===g.id&&p.user_id===uid&&p.status==='approved')&&rcOthers(g,uid).length>0}
function rcQueue(uid,kind,gid,from,at=Date.now()){RCQ.push({uid,kind,gid,from,at:rcQuiet(at)})}
function rcTick(){const now=Date.now();
  GAMES.forEach(g=>{if(g.status==='cancelled')return;const e=rcEnd(g);if(e>now||now-e>RC_WINDOW)return;
    PARTS.filter(p=>p.game_id===g.id&&p.status==='approved').forEach(p=>{const k=g.id+'|'+p.user_id,a=AFTER[k]||(AFTER[k]={});if(a.notified||a.closed)return;
      if(!rcEligible(g,p.user_id,now)){a.notified=true;return}const due=rcQuiet(e+RC_DELAY);if(now<due)return;a.notified=true;
      if(now-due<864e5)notify(p.user_id,'recap',g.id,p.user_id)})});
  const t2=Date.now();RCQ.filter(x=>x.at<=t2).forEach(x=>{RCQ.splice(RCQ.indexOf(x),1);
    if(x.kind==='badge'){bdgNotify(x.uid,x.from);return}
    if(x.kind==='follow_game'){const g=GAMES.find(y=>y.id===x.gid);if(!g||g.status!=='open'||new Date(g.starts_at)<=t2||!followHas(x.uid,x.from))return}
    notify(x.uid,x.kind,x.gid,x.from)})}

// ---------- 多遇到：TA 新发了适合你的局 ----------
function fgFits(g,u){if(!u||g.visibility==='private'||blockedPair(u.id,g.host_id))return false;if(isW(V(g))&&!womenOK(u))return false;

// 结尾的好感受：一个数字 + 一句只属于这场的亮点（第一场 / 里程碑 / 第一次来这个球场 / 和同一个人第 N 场 / 本月第 N 场），不做成任务
const RC_MILE=[10,25,50,100,150,200,300,500];
function rcHero(g,uid){const s=stats(uid),n=s.played,c=V(g),os=rcOthers(g,uid),mine=GAMES.filter(x=>x.status!=='cancelled'&&rcEnd(x)<=Date.now()&&PARTS.some(p=>p.game_id===x.id&&p.user_id===uid&&p.status==='approved'));

/* ===================== 徽章 · 好评 · 赴约 · 球友等级：统一规则 =====================
 * 一场「算数」的球：没被取消；已经结束；结束时你仍是确认参加的状态（中途撤回 / 退出的不算）；
 *   至少还有一位球友（或线下补位）；你没有被确认爽约。
 * 早场：08:00 及以前开场；夜场：19:00 及以后开场（都按开场时间算）。
 * 好评：同一位球友、同一场球，最多算 1 次好评——不管 TA 点了几个印象；一键「点赞同场球友」也算 1 次。
 *   印象（守时、友善……）照常分别计数，用来显示「大家最喜欢 TA 的地方」。
 * 赴约：不用签到。默认都到了；只有同场球友在结束后 48 小时内反馈「TA 没来」才会记录：
 *   发起人反馈、两人局里另一位反馈、或双打里两位球友都反馈 → 确认；被反馈的人会收到通知，可以申诉，申诉期间不计入。
 *   赴约率 = 到场 ÷（到场 + 爽约）。开打前 24 小时内退出不算爽约，但在等级里按半次计。
 * 球友等级：看的是「你是不是一个让人愿意再约的球友」，不是谁打得最多。
 *   好评率用平滑后的比例：（好评 + 2.5）÷（场次 + 10），新人不会因为样本少被误判；
 *   例：200 场 20 次好评 ≈ 0.11；40 场 15 次好评 ≈ 0.35 —— 后者等级更高。打得多，用场次和徽章来体现。 */

 * 4 人以上可以切换排序；超过 6 人先显示 6 位，其余收起。申请人比空位多时，告诉发起人人齐后其余申请会自动结束（对方看到「这局已经满员」），
 * 所以发起人只需要挑够人，不用一个个婉拒。

/* ===================== 婉拒申请：和婉拒邀约同一套做法 =====================

 * 系统自动结束的申请用中性的说法：满员 →「这局已经满员啦」；超时 →「发起人没来得及确认」；屏蔽 → 不通知。 */

 * 所以打开面板就开始生成，生成好之前按钮显示「正在生成分享图…」；分享失败（非用户取消）自动改为保存图片 + 复制文案。 */
function scBtn(){const b=document.querySelector('#scBox [data-sc="go"]');if(!b)return;const lab=SC.to==='xhs'?'发到小红书':'分享到朋友圈';
  if(SC.blob===null&&SC.busy){b.disabled=true;b.classList.add('busy');b.innerHTML='正在生成分享图…'}else{b.disabled=false;b.classList.remove('busy');b.innerHTML=`<svg><use href="#i-share"/></svg>${lab}`}}
function scBlobT(uid){return Promise.race([scBlob(uid),new Promise(r=>setTimeout(()=>r(null),8000))])}
saveCard=function(uid){SC.uid=uid;SC.blob=null;SC.busy=true;SHARE_OPEN(shareCardHTML(uid));scBtn();
  scBlobT(uid).then(b=>{if(SC.uid!==uid)return;SC.blob=b;SC.busy=false;scBtn()})};
const _scRender=scRender;scRender=function(){_scRender();scBtn()};
scGo=function(){const uid=SC.uid,to=SC.to,text=scCopyText(uid,to),app=to==='xhs'?'小红书':'微信',blob=SC.blob;
  try{navigator.clipboard&&navigator.clipboard.writeText(text).catch(()=>{})}catch(e){}
  const fallback=()=>{if(blob){scDownload(blob,uid);toast(`图片已保存，文案已复制 · 打开${app}发布即可`)}else toast(typeof ENV!=='undefined'&&ENV==='wechat'?'长按上面的图片保存，文案已复制':'文案已复制，截图即可分享')};
  const file=blob&&new File([blob],`nanbanqiu-${fmtNo(U(uid).no)}.png`,{type:'image/png'});
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){try{navigator.share({files:[file],text}).catch(err=>{if(!err||err.name!=='AbortError')fallback()})}catch(err){fallback()}return}
  fallback()};

/* =====================================================================
 * 通知 v2：一条通知，只提醒一次，提醒在对的设备上
 * ---------------------------------------------------------------------
 * 收件箱：每条通知只存一份，手机和电脑看到的是同一份列表，已读状态同步。
 * 提醒（横幅 / 推送）按下面的顺序决定发到哪里，同一条只提醒一处：
 *   ① 正在使用的设备：直接在页面里提醒；其他设备只更新红点
 *   ② 都没在用：优先推送到手机；手机没开推送，才推送到电脑
 *   ③ 出发相关（开打前提醒、取消、改时间、顺延）：在电脑上看到之外，也推送到手机
 *   ④ 夜间（城市当地时间，默认 22:00–08:00）：不紧急的推迟到早上 8 点；12 小时内开打的球局相关提醒照常
 *   ⑤ 推送前再检查一次：球局已取消 / 已开打 / 申请已处理 / 已读，就不再提醒
 *   ⑥ 手机没收到推送、5 分钟内也没看过：重要的提醒改发邮件（见 emFlush）
 * ===================================================================== */
const NR_PLAT=typeof renderPop==='function'?'desktop':'mobile',NR_OTHER=NR_PLAT==='mobile'?'desktop':'mobile';
var NR_LOG=[],NR_Q=[],NR_AWAY=false,NR_EXTRA=null;
const NR_URGENT=new Set(['soon','game_cancelled','changed','postponed','unfilled','unfilled_end']);
const NR_LOW=new Set(['recap','follow_game','badge','levelup','reopen','invite_expired','noshow']);
const NR_GO=new Set(['soon','game_cancelled','changed','postponed']);
const NR_SYS=new Set(['soon','noshow','badge','levelup','unfilled','unfilled_end']);
function nrDev(u){if(!u)return{mobile:{},desktop:{}};u.dev=u.dev||{mobile:{push:!!u.pushOK,active:false},desktop:{push:false,active:false}};
  if(u!==ME){u.dev.mobile.push=!!u.pushOK;u.dev.desktop.push=false;u.dev.mobile.active=u.dev.desktop.active=false}if(u===ME){const d=u.dev[NR_PLAT];d.push=!!PUSH.enabled&&!(typeof ENV!=='undefined'&&ENV==='wechat');d.active=document.visibilityState==='visible'&&!NR_AWAY}return u.dev}
// 城市当地时间的小时（CITY.tz）
function nrMelH(t){const s=new Date(t).toLocaleString('en-AU',{timeZone:CITY.tz,hour:'2-digit',minute:'2-digit',hour12:false});const[h,m]=s.split(':').map(Number);return [h%24,m]}
function nrQuiet(t){const[h,m]=nrMelH(t),x=h*60+m,qs=cityHM(CITY.quiet[0]),qe=cityHM(CITY.quiet[1]);if(qs>qe?(x<qs&&x>=qe):(x<qs||x>=qe))return t;let u=t+(((qe-x)%1440+1440)%1440)*6e4;const[h2,m2]=nrMelH(u);return u+(qe-h2*60-m2)*6e4}   // 夜间（城市的 quiet，默认 22:00–08:00）顺延到当地结束时刻；夏令时切换的夜里只有 23 / 25 小时：按当地墙上时间对齐
function nrGame(n){return n.game_id?GAMES.find(g=>g.id===n.game_id):null}
function nrPri(n){if(NR_URGENT.has(n.kind))return 0;if(NR_LOW.has(n.kind))return 2;const g=nrGame(n);
  if(g){const d=new Date(g.starts_at)-Date.now();if(d>0&&d<12*36e5)return 0}return 1}
function nrStale(n){if(n.read)return'已经看过';const g=nrGame(n),now=Date.now();
  if(n.from&&n.user_id&&blockedPair(n.user_id,n.from))return'有屏蔽关系';
  if(g){if(g.status==='cancelled'&&n.kind!=='game_cancelled')return'球局已取消';
    const st=+new Date(g.starts_at);if(st<=now&&!['unfilled_end','recap','noshow','game_cancelled','badge','levelup'].includes(n.kind))return'已经开打';
    if(n.kind==='request'&&!PARTS.some(p=>p.game_id===g.id&&p.user_id===n.from&&p.status==='pending'))return'申请已处理';
    if(n.kind==='soon'&&!PARTS.some(p=>p.game_id===g.id&&p.user_id===n.user_id&&p.status==='approved'))return'已不在这局';
    if(n.kind==='reopen'&&(V(g).spots<=0||PARTS.some(p=>p.game_id===g.id&&p.user_id===n.user_id&&['pending','approved'].includes(p.status))))return'已经没有空位或已报名';
    if(n.kind==='follow_game'&&(g.status!=='open'||PARTS.some(p=>p.game_id===g.id&&p.user_id===n.user_id&&p.status!=='withdrawn'&&p.status!=='left')))return'已经满员或已报名'}
  if(n.invite_id&&['invite','invite_counter'].includes(n.kind)){const i=invOf(n.invite_id);if(!i||!['pending','counter'].includes(i.status)||invExpired(i))return'邀约已结束'}
  return null}
// 需要处理的通知：列表里看过也保持未读，直到处理掉
function nrTodo(n){if(n.kind==='request_group')return PARTS.some(p=>p.game_id===n.game_id&&p.status==='pending'&&n.who.includes(p.user_id));
  if(n.kind==='request')return PARTS.some(p=>p.game_id===n.game_id&&p.user_id===n.from&&p.status==='pending')&&!nrStale({...n,read:false});
  if(n.invite_id&&['invite','invite_counter'].includes(n.kind)){const i=invOf(n.invite_id);return !!i&&!invExpired(i)&&((i.status==='pending'&&i.to===n.user_id)||(i.status==='counter'&&i.from===n.user_id))}
  return false}
const NR_DEST={'mobile-app':'手机 · 正在用，页面里提醒','desktop-app':'电脑 · 正在用，页面里提醒','mobile-push':'推送到手机','desktop-push':'推送到电脑（浏览器通知）','email':'推送没送达，5 分钟后没看就发邮件','inbox':'只进消息列表'};
function nrLog(n,dest,why){const u=U(n.user_id)||{name:'?'};let t='';try{t=(n.t||nrText(n)[0])}catch(e){}
  NR_LOG.unshift({at:Date.now(),who:u.name.split(' ')[0],me:!!ME&&n.user_id===ME.id,t,dest:Array.isArray(dest)?dest.map(x=>NR_DEST[x]||x).join(' + '):dest,why:why||''});NR_LOG.length=Math.min(NR_LOG.length,40);nrLogDraw()}
function nrText(n){if(n.t)return[n.t,n.b||''];try{const r=ntfText(n);if(r&&r.length)return r}catch(e){}return['南伴球','']}
// 决定提醒去哪；本设备需要提醒时调用 show
function nrDeliver(n,opt={}){const u=U(n.user_id);if(!u)return;const now=Date.now();
  if(typeof RQ_MUTE!=='undefined'&&RQ_MUTE){nrLog(n,'已合并到同一局的申请提醒');nrBadge();return}
  if(!opt.force&&nrPri(n)===2&&n.user_id===(ME&&ME.id)){const[mh,mm]=nrMelH(now),qd=mh*60+mm-cityHM(CITY.quiet[1]);if(qd>=0&&qd<10){NR_Q.push({n,at:now,show:opt.show,tap:opt.tap});clearTimeout(nrDeliver._t);nrDeliver._t=setTimeout(nrFlush,60);nrLog(n,'早上一起提醒');return}}
  if(!opt.force&&nrPri(n)>0){const q=nrQuiet(now);if(q>now){NR_Q.push({n,at:q,show:opt.show,tap:opt.tap});nrLog(n,`夜间，${hm(new Date(q))} 再提醒`,'不紧急的提醒推迟到早上');nrBadge();return}}
  const st=nrStale(n);if(st){nrLog(n,'不再提醒',st);if(n.kind==='follow_game')delete FG_LAST[n.user_id+'>'+n.from];nrBadge();return}
  const d=nrDev(u),to=[];
  if(d[NR_PLAT].active&&u===ME)to.push(NR_PLAT+'-app');else if(d[NR_OTHER].active)to.push(NR_OTHER+'-app');
  if(!to.length){if(d.mobile.push)to.push('mobile-push');else if(d.desktop.push)to.push('desktop-push')}
  else if(NR_GO.has(n.kind)&&to[0]!=='mobile-app'&&d.mobile.push)to.push('mobile-push');
  if(!to.length||(!to.includes('mobile-push')&&!to.includes('mobile-app')&&!to.includes('desktop-app'))){if(EM_KIND[n.kind]&&u.email)to.push('email')}
  if(!to.length)to.push('inbox');
  n.route=to;nrLog(n,to);
  if(u===ME&&to.some(x=>x.startsWith(NR_PLAT))){if(document.visibilityState!=='visible'){const[t,b]=nrText(n);nrSysNotify(t,b,opt.tap||(()=>nrOpen(n)),n)}else(opt.show||(()=>nrShow(n)))()}
  nrBadge();if(NR_PLAT==='desktop'&&$('#pop')&&$('#pop').classList.contains('show'))renderPop()}
function nrShow(n){const[t,b]=nrText(n),tap=()=>nrOpen(n);
  if(document.visibilityState!=='visible'){nrSysNotify(t,b,tap,n);return}
  if(NR_PLAT==='mobile')pushBanner(t,b,tap);else deskNotify(t,b,tap)}
// 页面在后台：系统通知（真实环境由 Service Worker 显示，tag 用 种类+球局，避免互相覆盖）
function nrSysNotify(t,b,tap,n){if(!PUSH.enabled||!('Notification'in window)||Notification.permission!=='granted')return;
  const tag=(n&&n.kind||'n')+'-'+(n&&(n.game_id||n.invite_id)||'');
  const go=x=>{try{x.onclick=()=>{window.focus();tap&&tap();x.close()}}catch(e){}};
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){navigator.serviceWorker.getRegistration().then(r=>{if(r)r.showNotification(t,{body:b,tag,data:{kind:n&&n.kind,game:n&&n.game_id}});else{try{go(new Notification(t,{body:b,tag}))}catch(e){}}}).catch(()=>{try{go(new Notification(t,{body:b,tag}))}catch(e){}})}
  else{try{go(new Notification(t,{body:b,tag}))}catch(e){}}}
function nrFlush(){const now=Date.now(),due=NR_Q.filter(x=>x.at<=now);if(!due.length)return;NR_Q=NR_Q.filter(x=>x.at>now);
  const mine=due.filter(x=>ME&&x.n.user_id===ME.id&&!nrStale(x.n));
  due.filter(x=>!mine.includes(x)).forEach(x=>nrDeliver(x.n,{force:true,show:x.show,tap:x.tap}));
  // 早上 8 点好几条一起到：合成一条，不连续弹
  if(mine.length>=2){mine.forEach(x=>{x.n.route=['merged'];nrLog(x.n,'早上合成一条提醒')});const n={user_id:ME.id,kind:'digest',t:`有 ${mine.length} 条新消息`,b:mine.slice(0,2).map(x=>nrText(x.n)[0]).join(' · ')+' ›'};
    const go=()=>{if(NR_PLAT==='mobile'){UI.msgTab='ntf';go2('notif')}else togglePop(true)};nrDeliver(n,{force:true,tap:go,show:()=>{NR_PLAT==='mobile'?pushBanner(n.t,n.b,go):deskNotify(n.t,n.b,go)}})}
  else mine.forEach(x=>nrDeliver(x.n,{force:true,show:x.show,tap:x.tap}))}
function go2(t){if(typeof closeDetail==='function'&&UI.detail)closeDetail();go(t)}

function nrToGame(id,uid){if(NR_PLAT==='mobile'){openDetail(id);if(uid)focusApplicant(uid)}else{$('#pop')&&$('#pop').classList.remove('show');if(UI.landing){UI.landing=null;history.replaceState(null,'','#/')}UI.tab='disc';select(id);if(uid&&window.webFocusApplicant)webFocusApplicant(uid)}}
function nrToDay(id){const g=GAMES.find(g=>g.id===id),o=g?dOff(new Date(g.starts_at)):-1;
  if(NR_PLAT==='mobile'){if(UI.detail)closeDetail();if(o>=0&&o<7)UI.day=o;UI.mode='cal';go('disc')}
  else{$('#pop')&&$('#pop').classList.remove('show');if(UI.landing){UI.landing=null;history.replaceState(null,'','#/')}UI.tab='disc';UI.sel=null;if(o>=0&&o<7)UI.page=o<=4?0:2;render()}}
function nrOpen(n){if(!n)return;if(!nrTodo(n))n.read=true;const k=n.kind;
  if(n.invite_id){if(k==='invite_accepted'&&n.game_id)INV_GAME(n.game_id);else openInvite(n.invite_id)}
  else if(k==='unfilled'||k==='unfilled_end')openUnfilled(n.game_id);
  else if(k==='recap')rcOpen(n.game_id);
  else if(k==='badge')bdgShow(n.user_id,n.badge);
  else if(k==='levelup'){if(LVREC[n.user_id])lvShow(n.user_id)}
  else if(k==='noshow')nsAppeal(n.game_id);
  else if(k==='soon')soonOpen(n.game_id);
  else if(['rejected','expired','full'].includes(k))nrToDay(n.game_id);
  else if(k==='request_group'){nrToGame(n.game_id,null);setTimeout(()=>{const h=document.querySelector('#dBody .rq-h,#colR .rq-h');h&&h.scrollIntoView({behavior:'smooth',block:'start'})},420)}
  else if(n.game_id)nrToGame(n.game_id,k==='request'?n.from:null);
  nrBadge()}

/* ===== 动画：冒出来 ===== */
// 一句话的气泡：「…」先冒出来 → 长成整句的气泡 → 字从模糊里浮出 → 气泡褪去
function bubbleIn(tx,{k=1,typing=true,delay=0,lag=0,perm=false,right=false}={}){
  const T=v=>v*k;
  const sm=!!tx.closest('.rp');
  if(!perm){tx.classList.add('bub');if(sm)tx.classList.add('sm');tx.insertAdjacentHTML('afterbegin','<i class="bb" aria-hidden="true"></i>')}
  const host=tx.offsetParent||tx.parentNode,W=tx.offsetWidth,Hh=tx.offsetHeight;
  let sx=.3,sy=.5,tOut=delay;
  if(typing){
    const p=document.createElement('div');p.className='typing'+(sm?' sm':'');p.innerHTML='<i></i><i></i><i></i>';host.append(p);
    const pw=p.offsetWidth,ph=p.offsetHeight;
    p.style.left=(right?tx.offsetLeft+W-pw:tx.offsetLeft)+'px';p.style.top=(tx.offsetTop+Hh-ph)+'px';
    if(right)p.style.transformOrigin='100% 100%';
    p.animate([{transform:'scale(.15)',opacity:0},{transform:'scale(1.08)',opacity:1,offset:.6},{transform:'scale(1)',opacity:1}],{duration:T(440),delay:delay+T(100),easing:'ease-out',fill:'both'});
    tOut=delay+T(720);
    p.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.92)',opacity:0}],{duration:T(170),delay:tOut,fill:'forwards'}).onfinish=()=>p.remove();
    sx=Math.min(1,pw/W);sy=Math.min(1,ph/Hh);
  }
  const tIn=tOut+lag;
  tx.style.transformOrigin=right?'100% 100%':'0 100%';
  tx.animate([{transform:`scale(${sx},${sy})`,opacity:0},{opacity:1,offset:.16},{transform:'scale(1)',opacity:1}],{duration:T(560),delay:tIn,easing:'cubic-bezier(.22,1.28,.42,1)',fill:'backwards'});
  const cs=[...tx.querySelectorAll('.c')],st=Math.min(24,560/Math.max(1,cs.length));
  cs.forEach((c,i)=>c.animate([{opacity:0,filter:'blur(5px)',transform:'translateY(4px)'},{opacity:1,filter:'blur(0px)',transform:'none'}],{duration:T(440),delay:tIn+T(110+i*st),easing:'cubic-bezier(.2,.7,.2,1)',fill:'backwards'}));
  const tEnd=tIn+T(110+cs.length*st+440);
  if(!perm)setTimeout(()=>{const bb=tx.querySelector(':scope>.bb'),done=()=>{if(bb)bb.remove();tx.classList.remove('bub','sm')};
    if(!bb||!tx.isConnected)return done();
    bb.animate([{opacity:1},{opacity:0}],{duration:T(900),easing:'ease',fill:'forwards'}).onfinish=done},tEnd+T(450));
  return {tOut,tIn,tEnd};
}
// 新的一行：先让出位置，再冒出来；带照片的，照片从气泡处像涟漪一样展开
function birth(row,{k=1,typing=true}={}){
  const host=row.closest('.it')||row,T=v=>v*k,cs=getComputedStyle(host),mt=parseFloat(cs.marginTop),mb=parseFloat(cs.marginBottom),h=host.offsetHeight;
  const slot=document.createElement('div');slot.className='slot';host.before(slot);slot.append(host);slot.style.overflow='hidden';
  slot.animate([{height:'0px'},{height:(h+mt+mb)+'px'}],{duration:T(460),easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>{slot.style.overflow=''};
  const tx=row.querySelector('.bd>.t>.tx'),bg=row.querySelector(':scope>.bg');
  const rr=row.getBoundingClientRect(),tr=tx.getBoundingClientRect(),ox=tr.left-rr.left,oy=tr.bottom-rr.top;
  const {tOut,tIn,tEnd}=bubbleIn(tx,{k,typing,delay:T(220),lag:bg?T(240):0});
  if(bg){const Rr=Math.hypot(rr.width,rr.height)+30;
    bg.animate([{clipPath:`circle(0px at ${ox}px ${oy}px)`},{clipPath:`circle(${Rr}px at ${ox}px ${oy}px)`}],{duration:T(950),delay:tOut-T(40),easing:'cubic-bezier(.45,0,.1,1)',fill:'backwards'})}
  row.querySelectorAll('.bd>.rp,.bd>.m').forEach(e=>e.animate([{opacity:0},{opacity:1}],{duration:T(380),delay:tIn,easing:'ease-out',fill:'backwards'}));
  if(!bg)row.animate([{backgroundColor:'rgba(255,255,255,.42)'},{backgroundColor:'rgba(238,246,200,.95)',offset:.3},{backgroundColor:'rgba(255,255,255,.42)'}],{duration:T(2600),delay:tIn});
}
// 一句新的回应：行高平滑变化，回应从小气泡里冒出
function replyIn(row,h0,{k=1,typing=true}={}){
  const T=v=>v*k,h1=row.offsetHeight;
  if(h1!==h0){row.style.overflow='hidden';row.animate([{height:h0+'px'},{height:h1+'px'}],{duration:T(380),easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>row.style.overflow=''}
  const tx=row.querySelector('.rp .tx');if(tx)bubbleIn(tx,{k,typing,delay:T(80)});
  const c=row.querySelector('.cnt');if(c)c.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:T(420),delay:T(900),easing:'ease-out'});
}

// 超了返回错误码；dry = 只看不记
const sbRate=(S,k,dry)=>{const now=Date.now(),R=S.rl||(S.rl={}),L=R[k]=(R[k]||[]).filter(t=>now-t<864e5),c=sbRateHit(L,k,now);

  if(n<st.name_min||n>st.name_max)return{err:'invalid'};

const sbBallTally=(balls,since)=>{const L=balls.filter(b=>b.t>=since);if(!L.length)return null;

{const _t=ntfText;ntfText=function(n){return n&&SB_NK.includes(n.kind)?sbNtfText(n):_t.apply(this,arguments)}}
