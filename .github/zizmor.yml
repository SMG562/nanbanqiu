# 注意：dangerous-triggers 的例外按整个文件忽略，这两个文件以后新增别的危险触发器也会被放过——改它们的触发器时复核要人工看。
# 存量例外（11-11 基线）：每条写明为什么可以留。新增 high 级问题不在这里，会让 workflow-lint 变红。
rules:
  dangerous-triggers:
    ignore:
      # collab-board 有意用 workflow_run / issue_comment / pull_request_target：只读 PR 元数据，只检出默认分支的三个文件，不执行 PR 里的任何代码（见该文件头注释）。
      - collab-board.yml
      # proposals 有意用 issue_comment：只读 Issue 文字，只在默认分支版本上跑、只检出 tools/proposal_tick.mjs 一个文件，不执行 Issue 里的任何内容（见该文件头注释）。
      - proposals.yml
