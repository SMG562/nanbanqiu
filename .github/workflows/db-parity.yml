name: db-parity
# 手动触发：核对 测试库 和 正式库 的结构是否一致（只读 select，不改库）。结果写在运行页的 Summary 里。
# 需要在 GitHub → Settings → Secrets and variables → Actions 里由你自己填两个 Secret（连接串不经过 Claude）：
#   NBQ_DB_URL_STAGING  测试库 Session pooler 连接串（建议用只读账号）
#   NBQ_DB_URL_PROD     正式库 Session pooler 连接串（建议用只读账号）
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 缺 Secret 就明说
        env: { A: "${{ secrets.NBQ_DB_URL_STAGING }}", B: "${{ secrets.NBQ_DB_URL_PROD }}" }
        run: |
          [ -n "$A" ] && [ -n "$B" ] || { echo "::error::还没填 NBQ_DB_URL_STAGING / NBQ_DB_URL_PROD（Settings → Secrets and variables → Actions）"; exit 1; }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: 对比
        env:
          NBQ_DB_URL: ${{ secrets.NBQ_DB_URL_STAGING }}
          NBQ_DB_URL_B: ${{ secrets.NBQ_DB_URL_PROD }}
        run: |
          set +e
          bash tools/db_parity.sh --diff > /tmp/out.txt 2>&1; code=$?
          { echo '## 测试库 vs 正式库'; echo '```'; head -c 60000 /tmp/out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/out.txt | head -80
          exit $code
