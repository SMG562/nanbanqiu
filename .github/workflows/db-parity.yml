name: db-parity
# 手动触发：核对 测试库 和 正式库 的结构是否一致（只读 select，不改库）。结果写在运行页的 Summary 里。
# 需要在 GitHub → Settings → Secrets and variables → Actions 里由你自己填两个 Secret（连接串不经过 Claude）：
#   NBQ_DB_URL_STAGING  测试库 Session pooler 连接串：staging 环境和 production 环境各放一份（11-11 核对：没有仓库级 Secret，避免分支里的工作流直接读到）
#   NBQ_DB_URL_PROD     production 环境 Secret：正式库 Session pooler 连接串（免费版没有审批，靠上面的确认词拦截）
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '这个流程会连正式库（只读）。输入 production 确认'
        required: true
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production   # 正式库连接串放在 production 环境的 Secret 里，只有 main 分支的工作流读得到
    steps:
      - name: 确认词
        run: '[ "${{ inputs.confirm }}" = "production" ] || { echo "::error::确认词不对（要输入 production），已停止"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 缺 Secret 就明说
        env: { A: "${{ secrets.NBQ_DB_URL_STAGING }}", B: "${{ secrets.NBQ_DB_URL_PROD }}" }
        run: |
          [ -n "$A" ] && [ -n "$B" ] || { echo "::error::还没填 NBQ_DB_URL_STAGING / NBQ_DB_URL_PROD（Settings → Secrets and variables → Actions）"; exit 1; }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: 对比
        env:
          NBQ_DB_URL: ${{ secrets.NBQ_DB_URL_STAGING }}
          NBQ_DB_URL_B: ${{ secrets.NBQ_DB_URL_PROD }}
        run: |
          set +e
          bash tools/db_parity.sh --diff > /tmp/out.txt 2>&1; code=$?
          { echo '## 测试库 vs 正式库'; echo '```'; head -c 60000 /tmp/out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/out.txt | head -80
          exit $code
