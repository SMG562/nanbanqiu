# 南伴球 · 自动测试（10-27 起）
#   开 PR / PR 有新提交：跑浏览器快速测试（测 PR 最新提交本身）；同一 PR 连续推送只跑最新一次。
#   11-07 省额度：草稿 PR 不开机器（运行标题带「未测：草稿」，ci_reuse / pr_merge / gate 都不认它）；点「Ready for review」才跑。
#     PR / 推 main 的快速档只跑浏览器测试，不腾磁盘、不装 pglast（只有完整档要；PostgreSQL 浏览器端到端测试也要，照装）。
#   推送到 main：同一个提交已在 PR 上通过 → 复用结果、不重跑（11-04，tools/ci_reuse.sh，只认完全相同的提交号；合并用 tools/pr_merge.sh 只快进）；
#   否则照常跑快速测试（--quick --fast）。只改文档不跑。
#   每周日凌晨（墨尔本时间约 3 点）+ 手动：完整测试（含一年数据量性能、全部时间点、回归快照）。
#   结果：Actions 页面的摘要 = tests/reports/<时间>/summary.md；完整报告和日志在 Artifacts 里下载。
name: tests
run-name: "${{ github.event_name == 'workflow_dispatch' && format('tests（手动 {0}）', inputs.mode) || github.event_name == 'pull_request' && format('PR #{0} {1}{2}', github.event.pull_request.number, github.event.pull_request.draft && '未测：草稿 · ' || '', github.event.pull_request.title) || github.event.head_commit.message || 'tests' }}"

on:
  push:
    branches: [main, staging-env]   # 11-03：加上测试分支，合并前就能看到浏览器测试结果
    paths:
      - '**.html'
      - 'src/**'               # 11-11（ADR 0011）：页面 HTML 不再入库，改样式 / 拼接清单只动 src/ 下的 .css / .list，也要跑测试
      - '**.js'
      - '**.mjs'
      - '**.cjs'
      - '**.sql'
      - '**.py'
      - 'manifest.webmanifest'
      - 'tests/**'
      - '.github/workflows/**'
      - '**.json'               # 11-04：依赖（package*.json）、海报清单、数据文件；以前改了不跑任何测试（tests/unit/ci_paths 盯着，两份工作流必须一致）
      - '**.jsonc'              # 部署配置（wrangler）
      - '**.sh'                 # 流程脚本（gate / sync_verify / handoff_check …）
      - '.githooks/**'          # 提交前 / 推送前检查
      - '.gitattributes'        # 合并规则（生成文件 / 拼接清单；tests/unit/merge_rules 测它）
      - 'vendor/**'             # 11-11：第三方库本站托管（leaflet / qrcodejs / html2canvas），页面直接加载
      - '!marketing/icons/**'   # 11-04：同 tests-fast.yml；海报（marketing/posters 等）仍会触发，因为 tests/frontend/site.js 检查它们
  pull_request:                 # 11-04：PR 上先测，合并（快进）后 main 复用结果；paths 必须和 push 一致（tests/unit/ci_paths 盯着）
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.html'
      - 'src/**'               # 11-11（ADR 0011）：页面 HTML 不再入库，改样式 / 拼接清单只动 src/ 下的 .css / .list，也要跑测试
      - '**.js'
      - '**.mjs'
      - '**.cjs'
      - '**.sql'
      - '**.py'
      - 'manifest.webmanifest'
      - 'tests/**'
      - '.github/workflows/**'
      - '**.json'               # 11-04：依赖（package*.json）、海报清单、数据文件；以前改了不跑任何测试（tests/unit/ci_paths 盯着，两份工作流必须一致）
      - '**.jsonc'              # 部署配置（wrangler）
      - '**.sh'                 # 流程脚本（gate / sync_verify / handoff_check …）
      - '.githooks/**'          # 提交前 / 推送前检查
      - '.gitattributes'        # 合并规则（生成文件 / 拼接清单；tests/unit/merge_rules 测它）
      - 'vendor/**'             # 11-11：第三方库本站托管（leaflet / qrcodejs / html2canvas），页面直接加载
      - '!marketing/icons/**'   # 11-04：同 tests-fast.yml；海报（marketing/posters 等）仍会触发，因为 tests/frontend/site.js 检查它们
  schedule:
    - cron: '0 16 * * *'        # 11-12（#214 阶段 1f）：每周 → 每晚。UTC 16:00 = 墨尔本次日 02:00–03:00；main 自上次夜间全量通过后没有新提交就跳过（gate 任务）
  workflow_dispatch:
    inputs:
      mode:
        description: '测试档位'
        type: choice
        options: [quick, full, visual-baseline]
        default: full

permissions:
  contents: read         # 11-11（#178）：顶层只读；只有 baseline-commit 任务拿 contents: write（跑 PR 代码的 shard 任务没有写权限）
  actions: read          # 复用结果要查这个提交以前的运行
  pull-requests: read    # 压缩合并后按「内容相同」找 PR 上测过的提交（tools/ci_reuse.sh）

concurrency:                    # 同一分支 / 同一 PR 连续推送时，只跑最新的那次
  group: tests-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.pull_request.number) || github.ref }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'x' }}   # 手动触发各自独立，不互相取消
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  reuse:                 # 推到 main 时：同一提交已通过 → 下面的 test 跳过（跳过 = 本次运行仍是 success，上线闸门认它）
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      hit: ${{ steps.r.outputs.hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { sparse-checkout: tools/ci_reuse.sh, sparse-checkout-cone-mode: false, persist-credentials: false }
      - id: r
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash tools/ci_reuse.sh tests

  gate:                  # 夜间全量：main 还是上次夜间全量通过的那个提交 → 跳过（只有 schedule 触发才查，其余事件这个任务本身被跳过）
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
          if [ -n "$last" ] && [ "$last" = "$SHA" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "main 自上次夜间全量通过（${SHA:0:7}）后没有新提交：本次跳过" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"   # 查不到（接口出错 / 第一次）一律照常测，宁可多跑不漏测
          fi

  shard:                 # 11-11：浏览器测试分片并行（n 台机器各跑一份，run_all --shard=i/n；分法见 tests/run_all.mjs，守卫 tests/unit/shard）
    needs: [reuse, gate]
    if: ${{ !cancelled() && needs.reuse.outputs.hit != '1' && !(github.event_name == 'pull_request' && github.event.pull_request.draft) && needs.gate.outputs.skip != '1' }}   # reuse 没开机器（PR / 分支）或查询出错 → 照常测试；只有命中才跳过；草稿 PR 不测
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false     # 一份失败不取消其它份：一次就能看到全部失败项，不用修一个再等一轮
      matrix:
        # 手动重拍截图基准只能一台机器（它会提交并推回分支）；公开仓库机器免费 → 4 份（每台 2 项并发；11-11 实测 3 份 296s，瓶颈已是总工作量/并行度）；私有仓库按分钟计费且 2 核 → 2 份（每多一份多付一次装环境的钟点）
        shard: ${{ fromJSON(inputs.mode == 'visual-baseline' && '["1/1"]' || github.event.repository.private == true && '["1/2","2/2"]' || '["1/4","2/4","3/4","4/4"]') }}
    env:
      NBQ_CACHE: ${{ github.workspace }}/.nbq-cache
      TZ: Australia/Melbourne
      NBQ_LITE: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}   # 快速档：下面「跑测试」--skip=static,unit,schema,pg，用不到 pglast / 大磁盘（PostgreSQL 仍要：e2e_fullstack、e2e_admin_login）
    # 并发数保持每台 2 项（11-11 试过 4：2 次运行各偶发 1 项失败——visual/shots、frontend/buddies，重跑才过；并行已由分片提供）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # 11-11（#178）：令牌不留在 .git/config 里（这里要跑 PR 自己的代码）
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}   # PR：测 PR 最新提交本身（不是临时合并结果）；合并只快进，main 上就是这个提交
      - name: 取 origin/main（migration_audit 的「已合并的迁移不许改」要对照它）
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main || echo '取不到 origin/main，migration_audit 会跳过这一项'

      - name: 腾磁盘（一年数据量性能测试会写满 runner 的盘）
        if: env.NBQ_LITE != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / | tail -1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: 系统依赖（PostgreSQL 16 + PostGIS、中文字体）
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-postgis-3 fonts-noto-cjk fonts-noto-color-emoji   # 快速档也要：e2e_fullstack / e2e_admin_login 起真实 PostgreSQL + PostGIS
          [ "$NBQ_LITE" = true ] && exit 0   # pglast 只有 schema 套件用（快速档跳过）
          pip install --break-system-packages -q pglast || pip install -q pglast

      - name: 依赖缓存（PGlite、pg、Playwright 浏览器）
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .nbq-cache
            ~/.cache/ms-playwright
          key: nbq-${{ runner.os }}-pw1.63.0-${{ hashFiles('tests/pg/package.json', 'tests/schema/package.json', 'tests/lint/package.json') }}

      - name: Playwright
        run: |
          npm i -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium

      - name: 重拍截图基准（只在手动选 visual-baseline 时：用 CI 的字体重拍；提交由下面的 baseline-commit 任务做，这里没有写权限）
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'visual-baseline'
        run: NBQ_VISUAL_UPDATE=1 node tests/run_all.mjs --only=visual
      - name: 上传新基准
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'visual-baseline'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baseline
          path: tests/visual/baseline/

      - name: 跑测试
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'visual-baseline'
        run: |
          run_tests() {
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then   # PR 和推 main 跑同一套，复用才成立
              node tests/run_all.mjs --quick --fast --skip=static,unit,schema,pg --shard=${{ matrix.shard }} --jobs=2   # 静态 / 单元 / 数据库由 tests-fast.yml 跑（不被取消）
            elif [ "${{ inputs.mode }}" = "quick" ]; then
              node tests/run_all.mjs --quick --fast --shard=${{ matrix.shard }} --jobs=2
            else
              node tests/run_all.mjs --shard=${{ matrix.shard }} --jobs=2
            fi
          }
          # 11-10（ADR 0010）：失败先只重跑失败项一次；重跑通过 = 偶发失败，不挡合并，但留下警告（同一条在 ≥ 2 次运行里偶发 = 缺陷，开 Issue 修，不当「抖动」放过）
          if ! run_tests; then
            cp tests/reports/failed.json /tmp/failed_first.json 2>/dev/null || echo '[]' > /tmp/failed_first.json
            echo "::group::第一次失败的项（只重跑这些一次）"; cat /tmp/failed_first.json; echo; echo "::endgroup::"
            if node tests/run_all.mjs --failed --jobs=2; then
              echo "::warning title=偶发失败（重跑通过）::$(tr -d '\n ' < /tmp/failed_first.json | cut -c1-500)"
              echo "偶发失败（重跑通过）：$(tr -d '\n ' < /tmp/failed_first.json)" >> "$GITHUB_STEP_SUMMARY"
            else exit 1; fi
          fi

      - name: 摘要
        if: always()
        run: |
          R=$(ls -td tests/reports/*/ 2>/dev/null | head -1)
          if [ -n "$R" ] && [ -f "$R/summary.md" ]; then cat "$R/summary.md" >> "$GITHUB_STEP_SUMMARY"; else echo "没有生成报告（环境准备阶段失败，看上面的日志）" >> "$GITHUB_STEP_SUMMARY"; fi

      # 结果也写成注解：会话里的 Claude 用 gh api 读得到（日志和附件下载在会话里被拦）
      - name: 结果注解
        if: always()
        run: |
          R=$(ls -td tests/reports/*/ 2>/dev/null | head -1)
          [ -n "$R" ] && [ -f "$R/results.json" ] || { echo "::error title=测试没跑起来::环境准备阶段失败"; exit 0; }
          python3 - "$R/results.json" <<'PY'
          import json, sys
          rs = json.load(open(sys.argv[1]))['results']
          bad = [r for r in rs if not r['ok']]
          print(f"::notice title=测试结果::{len(rs)} 项，失败 {len(bad)} 项" + ("：" + "、".join(r['id'] for r in bad) if bad else ""))
          slow = sorted(rs, key=lambda r: -r.get('ms', 0))[:15]   # E2：用时最长的几项（会话里量前后用时靠它；11-11 起前 15 项，也是刷新 tests/spec/test_weights.json 的数据）
          print("::notice title=用时最长::" + "、".join(f"{r['id']} {r.get('ms', 0) // 1000}s" for r in slow) + f"；合计 {sum(r.get('ms', 0) for r in rs) // 1000}s")
          for r in bad[:10]:
              msg = '；'.join(r.get('why', []) + r.get('fails', [])).replace('\n', ' ')[:3000]   # fails = 具体的 FAIL / 报错行（run_all 记的）
              print(f"::error title={r['id']}::{msg}")
          PY

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.run_number }}-${{ strategy.job-index }}   # 每份一个（同名会冲突）
          path: tests/reports/
          retention-days: 14

  test:                  # 汇总：所有分片都成功才算成功。名字保持 test（以前是单个任务）；复用命中 / 草稿 PR 时分片被跳过 → 这里也跳过，整个运行仍是 success（gate / pr_merge / ci_reuse 看的是整个运行的结论）
    needs: shard
    if: ${{ !cancelled() && needs.shard.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 所有分片都通过？
        env: { R: "${{ needs.shard.result }}" }
        run: |
          echo "分片结果：$R"
          [ "$R" = success ] || { echo "::error title=浏览器测试::有分片没通过（$R），看上面各个 test (i/n) 任务的注解"; exit 1; }

  baseline-commit:       # 11-11（#178）：重拍的基准提交回触发分支。只有它带 contents: write，且不运行任何测试 / PR 代码，只搬运截图
    needs: shard
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'visual-baseline' && needs.shard.result == 'success' }}   # 11-13：不写状态函数时隐含 success()，gate / reuse 被跳过（#222 起）就连带跳过本任务，重拍的基准推不回分支；!cancelled() 只看 shard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read          # gh run download 取上一个任务上传的新基准（不引入新的第三方 action）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: 提交并推回触发这次运行的分支
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # 11-13：gh run download 遇到目标目录里已有同名文件会报错不覆盖（run 43413200956「file exists」），先下到临时目录再覆盖拷贝
          gh run download "$RUN_ID" --repo "$REPO" -n visual-baseline -D "$RUNNER_TEMP/vb"
          cp -f "$RUNNER_TEMP"/vb/*.png tests/visual/baseline/
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add tests/visual/baseline
          git commit -m "截图基准：用 CI 环境重拍" || { echo "基准没有变化"; exit 0; }
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"   # 检出固定在提交号（游离头）；令牌只在这一条命令里用
