# 南伴球 · 自动测试（10-27 起）
#   开 PR / PR 有新提交：跑浏览器快速测试（测 PR 最新提交本身）；同一 PR 连续推送只跑最新一次。
#   推送到 main：同一个提交已在 PR 上通过 → 复用结果、不重跑（11-04，tools/ci_reuse.sh，只认完全相同的提交号；合并用 tools/pr_merge.sh 只快进）；
#   否则照常跑快速测试（--quick --fast）。只改文档不跑。
#   每周日凌晨（墨尔本时间约 3 点）+ 手动：完整测试（含一年数据量性能、全部时间点、回归快照）。
#   结果：Actions 页面的摘要 = tests/reports/<时间>/summary.md；完整报告和日志在 Artifacts 里下载。
name: tests
run-name: "${{ github.event_name == 'workflow_dispatch' && format('tests（手动 {0}）', inputs.mode) || github.event_name == 'pull_request' && format('PR #{0} {1}', github.event.pull_request.number, github.event.pull_request.title) || github.event.head_commit.message || 'tests' }}"

on:
  push:
    branches: [main, staging-env]   # 11-03：加上测试分支，合并前就能看到浏览器测试结果
    paths:
      - '**.html'
      - '**.js'
      - '**.mjs'
      - '**.cjs'
      - '**.sql'
      - '**.py'
      - 'manifest.webmanifest'
      - 'tests/**'
      - '.github/workflows/**'
      - '**.json'               # 11-04：依赖（package*.json）、海报清单、数据文件；以前改了不跑任何测试（tests/unit/ci_paths 盯着，两份工作流必须一致）
      - '**.jsonc'              # 部署配置（wrangler）
      - '**.sh'                 # 流程脚本（gate / sync_verify / handoff_check …）
      - '.githooks/**'          # 提交前 / 推送前检查
      - '!marketing/icons/**'   # 11-04：同 tests-fast.yml；海报（marketing/posters 等）仍会触发，因为 tests/frontend/site.js 检查它们
  pull_request:                 # 11-04：PR 上先测，合并（快进）后 main 复用结果；paths 必须和 push 一致（tests/unit/ci_paths 盯着）
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.html'
      - '**.js'
      - '**.mjs'
      - '**.cjs'
      - '**.sql'
      - '**.py'
      - 'manifest.webmanifest'
      - 'tests/**'
      - '.github/workflows/**'
      - '**.json'               # 11-04：依赖（package*.json）、海报清单、数据文件；以前改了不跑任何测试（tests/unit/ci_paths 盯着，两份工作流必须一致）
      - '**.jsonc'              # 部署配置（wrangler）
      - '**.sh'                 # 流程脚本（gate / sync_verify / handoff_check …）
      - '.githooks/**'          # 提交前 / 推送前检查
      - '!marketing/icons/**'   # 11-04：同 tests-fast.yml；海报（marketing/posters 等）仍会触发，因为 tests/frontend/site.js 检查它们
  schedule:
    - cron: '0 16 * * 6'        # UTC 周六 16:00 = 墨尔本周日 02:00–03:00
  workflow_dispatch:
    inputs:
      mode:
        description: '测试档位'
        type: choice
        options: [quick, full, visual-baseline]
        default: full

permissions:
  contents: write
  actions: read          # 复用结果要查这个提交以前的运行

concurrency:                    # 同一分支 / 同一 PR 连续推送时，只跑最新的那次
  group: tests-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.pull_request.number) || github.ref }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'x' }}   # 手动触发各自独立，不互相取消
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  reuse:                 # 推到 main 时：同一提交已通过 → 下面的 test 跳过（跳过 = 本次运行仍是 success，上线闸门认它）
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      hit: ${{ steps.r.outputs.hit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { sparse-checkout: tools/ci_reuse.sh, sparse-checkout-cone-mode: false }
      - id: r
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash tools/ci_reuse.sh tests

  test:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.hit != '1' }}   # reuse 没开机器（PR / 分支）或查询出错 → 照常测试；只有命中才跳过
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      NBQ_CACHE: ${{ github.workspace }}/.nbq-cache
      TZ: Australia/Melbourne
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}   # PR：测 PR 最新提交本身（不是临时合并结果）；合并只快进，main 上就是这个提交
      - name: 取 origin/main（migration_audit 的「已合并的迁移不许改」要对照它）
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main || echo '取不到 origin/main，migration_audit 会跳过这一项'

      - name: 腾磁盘（一年数据量性能测试会写满 runner 的盘）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / | tail -1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: 系统依赖（PostgreSQL 16 + PostGIS、中文字体）
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-postgis-3 fonts-noto-cjk fonts-noto-color-emoji
          pip install --break-system-packages -q pglast || pip install -q pglast

      - name: 依赖缓存（PGlite、pg、Playwright 浏览器）
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .nbq-cache
            ~/.cache/ms-playwright
          key: nbq-${{ runner.os }}-pw1.63.0-${{ hashFiles('tests/pg/package.json', 'tests/schema/package.json', 'tests/lint/package.json') }}

      - name: Playwright
        run: |
          npm i -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium

      - name: 重拍截图基准（只在手动选 visual-baseline 时：用 CI 的字体重拍，提交回 main）
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'visual-baseline'
        run: |
          NBQ_VISUAL_UPDATE=1 node tests/run_all.mjs --only=visual
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add tests/visual/baseline
          git commit -m "截图基准：用 CI 环境重拍" || echo "基准没有变化"
          git push

      - name: 跑测试
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'visual-baseline'
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then   # PR 和推 main 跑同一套，复用才成立
            node tests/run_all.mjs --quick --fast --skip=static,unit,schema,pg --jobs=2   # 静态 / 单元 / 数据库由 tests-fast.yml 跑（不被取消）
          elif [ "${{ inputs.mode }}" = "quick" ]; then
            node tests/run_all.mjs --quick --fast --jobs=2
          else
            node tests/run_all.mjs --jobs=2
          fi

      - name: 摘要
        if: always()
        run: |
          R=$(ls -td tests/reports/*/ 2>/dev/null | head -1)
          if [ -n "$R" ] && [ -f "$R/summary.md" ]; then cat "$R/summary.md" >> "$GITHUB_STEP_SUMMARY"; else echo "没有生成报告（环境准备阶段失败，看上面的日志）" >> "$GITHUB_STEP_SUMMARY"; fi

      # 结果也写成注解：会话里的 Claude 用 gh api 读得到（日志和附件下载在会话里被拦）
      - name: 结果注解
        if: always()
        run: |
          R=$(ls -td tests/reports/*/ 2>/dev/null | head -1)
          [ -n "$R" ] && [ -f "$R/results.json" ] || { echo "::error title=测试没跑起来::环境准备阶段失败"; exit 0; }
          python3 - "$R/results.json" <<'PY'
          import json, sys
          rs = json.load(open(sys.argv[1]))['results']
          bad = [r for r in rs if not r['ok']]
          print(f"::notice title=测试结果::{len(rs)} 项，失败 {len(bad)} 项" + ("：" + "、".join(r['id'] for r in bad) if bad else ""))
          slow = sorted(rs, key=lambda r: -r.get('ms', 0))[:8]   # E2：用时最长的几项（会话里量前后用时靠它）
          print("::notice title=用时最长::" + "、".join(f"{r['id']} {r.get('ms', 0) // 1000}s" for r in slow) + f"；合计 {sum(r.get('ms', 0) for r in rs) // 1000}s")
          for r in bad[:10]:
              msg = '；'.join(r.get('why', []) + r.get('fails', [])).replace('\n', ' ')[:3000]   # fails = 具体的 FAIL / 报错行（run_all 记的）
              print(f"::error title={r['id']}::{msg}")
          PY

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports-${{ github.run_number }}
          path: tests/reports/
          retention-days: 14
