# 南伴球 · 图稿轻量检查（11-04）：只改 marketing/icons（小毛图标 svg + 出图脚本）时跑这个，几秒出结果；
#   完整测试（tests-fast / tests）对这类提交排除了 '!marketing/icons/**'，因为没有任何测试或站点引用这个目录。
name: icons-lint

on:
  push:
    branches: ['**']
    paths:
      - 'marketing/icons/**'
      - 'tools/lint_icons.py'
      - '.github/workflows/icons-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icons-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: svg 检查（能解析 / 有 viewBox / 无脚本外链 / 体积上限）
        run: python3 tools/lint_icons.py marketing/icons
