# 提案「24 小时无异议自动生效」（11-11，#167 第四节）：带「提案」标签的 Issue 写了「默认方案」后倒计时，无异议自动生效。
#   规则和安全说明见 tools/proposal_tick.mjs。约 15 秒、只读 Issue 文字；只在默认分支版本上跑、只检出一个文件，不执行任何 Issue 里的内容。
name: proposals

on:
  schedule:
    - cron: '41 * * * *'            # 每小时对账（倒计时到点、漏掉的事件）
    - cron: '*/10 * * * *'          # 11-19：排队 / 等审批看门狗（queue-watch 作业；工作流数有上限 13，并进这里不新增文件）
  workflow_dispatch:
  issues:
    types: [opened, labeled, edited]
  issue_comment:
    types: [created]
  push:                             # 11-17：主干上规则文件有变化 → 自动在 #216 通知协作者（不再靠人记得发）；11-18（#363）：通知机制本身（看板 / pr_say / 两个工作流 / 协作分工）也算，三份清单由 tests/unit/notify_watch.mjs 守一致
    branches: [main]
    paths: ['.claude/**', 'CLAUDE.md', 'tools/lib/token_*.mjs', 'tools/collab_board.mjs', 'tools/pr_say.sh', '.github/workflows/collab-board.yml', '.github/workflows/proposals.yml', 'docs/协作分工.md', 'docs/roadmap.md']

permissions:
  contents: read

concurrency:
  group: proposals-${{ github.event.schedule }}   # 11-19：每 10 分钟的看门狗单独一组，不会把排队中的整点对账挤掉（其他触发 schedule 为空，组名同原来）
  cancel-in-progress: false

jobs:
  tick:
    if: github.event_name != 'push' && github.event.schedule != '*/10 * * * *' && (github.event_name != 'issue_comment' || !github.event.issue.pull_request)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: { contents: read, issues: write }   # 写权限只给各 job（workflow 级只读，zizmor）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tools/proposal_tick.mjs
          sparse-checkout-cone-mode: false
      - name: 对账提案
        env: { GH_TOKEN: '${{ github.token }}' }
        run: node tools/proposal_tick.mjs

  queue-watch:
    # 11-19：运行停在「等审批 / 排队」超过 10 分钟就留言 @ 审批人并写明堵在谁后面（#402 的正式库计划排在 #399 的 staging 审批后面一直 Pending，没人知道）。
    #   逻辑在 tools/ci_wait.sh --stuck（会话里也能直接跑）；同一运行同一结论只发一次（pr_say 去重）。公开仓库，Actions 分钟免费。
    if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: { contents: read, actions: read, issues: write, pull-requests: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { sparse-checkout: tools, persist-credentials: false }
      - name: 看卡住的运行并留言
        env: { GH_TOKEN: '${{ github.token }}' }
        run: bash tools/ci_wait.sh --stuck --min=10 --say || [ $? -eq 4 ]   # 4 = 有卡住的（已留言），不算失败

  notify:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: { contents: read, issues: write }   # 写权限只给各 job（workflow 级只读，zizmor）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 50 }
      - name: 通知协作者（只读文件名和提交标题，不执行任何内容）
        env: { GH_TOKEN: '${{ github.token }}', BEFORE: '${{ github.event.before }}', SHA: '${{ github.sha }}' }
        run: |
          set -eu
          git cat-file -e "$BEFORE" 2>/dev/null || git fetch -q --depth=50 origin "$BEFORE" || exit 0
          files=$(git -c core.quotepath=off diff --name-only "$BEFORE" "$SHA" -- .claude CLAUDE.md 'tools/lib/token_*.mjs' 'tools/collab_board.mjs' 'tools/pr_say.sh' '.github/workflows/collab-board.yml' '.github/workflows/proposals.yml' 'docs/协作分工.md' 'docs/roadmap.md' | head -6 | sed 's/^/- /')
          [ -n "$files" ] || exit 0
          subj=$(git log --format='%s' "$BEFORE..$SHA" | head -3 | PYTHONUTF8=1 python3 -c 'import sys; [print("- " + l.rstrip("\n")[:40]) for l in sys.stdin]')   # 按字符截（按字节截会把汉字切成乱码）
          body=$(printf '【规则自动同步 %s】@MDD1102 主干规则 / 通知机制文件有变化；你开工时 Claude 会自动提示 git pull，不用另外读这条。\n改了：\n%s\n提交：\n%s\n只读上面文件的 diff 即可。' "${SHA:0:7}" "$files" "$subj")
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/216/comments" -f body="$body" >/dev/null
