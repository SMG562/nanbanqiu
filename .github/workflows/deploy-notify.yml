# 通知定时 Worker（nanbanqiu-notify）：改了发送规则 / 推送代码后自动部署，不用再手动 wrangler deploy。
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 里加两个 Secret：CLOUDFLARE_API_TOKEN（权限：Workers 编辑）、CLOUDFLARE_ACCOUNT_ID。
# Worker 自己的密钥（DB_URL / VAPID_* / RESEND_KEY）已存在 Cloudflare 里，部署不会动它们。
name: deploy-notify
on:
  push:
    branches: [main]
    paths: ['server/notify/**', 'server/api/connect.mjs', 'worker/notify.mjs', 'notify-worker/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: 部署
        working-directory: notify-worker
        run: node ../tools/deploy_notify.mjs   # 部署 + 核对线上指纹
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
