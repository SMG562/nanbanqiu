# 通知定时 Worker（nanbanqiu-notify）：改了发送规则 / 推送代码后自动部署并核对线上指纹，不用再手动部署。
# 启用：GitHub 仓库 Settings → Secrets and variables → Actions 里加两个 Secret：CLOUDFLARE_API_TOKEN（权限：Workers 编辑）、CLOUDFLARE_ACCOUNT_ID。
# 没配时这个工作流直接跳过（不报错）。Worker 自己的密钥（DB_URL / VAPID_* / RESEND_KEY）在 Cloudflare 里，部署不会动它们。
name: deploy-notify
on:
  push:
    branches: [main]
    paths: ['server/notify/**', 'server/api/connect.mjs', 'worker/notify.mjs', 'notify-worker/**', 'tools/worker_version.mjs', 'tools/deploy_notify.mjs']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 检查密钥
        id: k
        run: if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "have=yes" >> "$GITHUB_OUTPUT"; else echo "没配 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过自动部署（手动：node tools/deploy_notify.mjs）"; fi
      - uses: actions/checkout@v4
        if: steps.k.outputs.have == 'yes'
      - uses: actions/setup-node@v4
        if: steps.k.outputs.have == 'yes'
        with: { node-version: 22 }
      - run: npm ci
        if: steps.k.outputs.have == 'yes'
      - name: 部署并核对线上指纹
        if: steps.k.outputs.have == 'yes'
        run: node tools/deploy_notify.mjs --force-no-expect   # CI 里代码就是仓库本身，不存在「本机文件夹不是最新」
