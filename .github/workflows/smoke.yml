# 南伴球 · 上线后冒烟测试（11-03）：推送到 main 后等线上换成这一版，再检查接口和手机端 / 网页端能不能正常打开。
#   也每 6 小时跑一次（不等版本），线上出问题能尽早发现。结果在 Actions 页面；失败会让这一项变红。
name: smoke
on:
  push:
    branches: [main]
    paths: ['src/**', '**.html', 'sw.js', 'functions/**', 'server/**', 'tools/site.mjs', 'tools/smoke_prod.mjs']
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
concurrency:
  group: smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: |
          npm i -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
      - name: 冒烟（推送时等线上换成本次提交；定时 / 手动不等版本）
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then node tools/smoke_prod.mjs --sha=${{ github.sha }}; else node tools/smoke_prod.mjs --no-wait; fi
