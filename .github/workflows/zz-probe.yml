# 临时探针（#27，不合并）：从 GitHub 访问分支预览，看 scrypt 会不会被 Cloudflare 的 CPU 限制杀掉
name: zz-probe
on:
  push:
    branches: [admin-api-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 分支预览的后台有没有 Access；探针已撤
        run: |
          B=https://admin-api-probe.nanbanqiu-preview.pages.dev
          sleep 90
          for p in /admin /admin.html /admin/api/me /api/zz-probe; do echo "== $p"; curl -s -L --max-redirs 3 -o /tmp/b -w '%{http_code} %{url_effective}\n' "$B$p"; head -c 160 /tmp/b | tr -d '\n'; echo; done
          echo "== staging"; curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' https://staging.nanbanqiu-preview.pages.dev/admin
