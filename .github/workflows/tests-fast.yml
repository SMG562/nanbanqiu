# 南伴球 · 快速自动测试（11-03）：静态 + 单元 + 数据库（不开浏览器），每次推送都跑、**不被后面的推送取消**，
#   所以每个提交都有一个确定的「通过 / 失败」。浏览器那部分在 tests.yml（连续推送时只跑最新一次）。
#   推到 main 的提交已在分支上通过（快进合并 = 同一提交号）→ 复用结果、不重跑（11-04，tools/ci_reuse.sh）。
name: tests-fast

on:
  push:
    branches: ['**']   # 所有分支（11-03：之前只有 main，分支上的提交没有任何自动检查）
    paths:
      - '**.html'
      - '**.js'
      - '**.mjs'
      - '**.cjs'
      - '**.sql'
      - '**.py'
      - 'manifest.webmanifest'
      - 'tests/**'
      - '.github/workflows/**'
      - '**.json'               # 11-04：依赖（package*.json）、海报清单、数据文件；以前改了不跑任何测试（tests/unit/ci_paths 盯着，两份工作流必须一致）
      - '**.jsonc'              # 部署配置（wrangler）
      - '**.sh'                 # 流程脚本（gate / sync_verify / handoff_check …）
      - '.githooks/**'          # 提交前 / 推送前检查
      - '!marketing/icons/**'   # 11-04：小毛图标（svg + 出图脚本）没有任何测试或站点引用，只跑 icons-lint.yml；放在最后，否定规则只作用于它前面的规则
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tests-fast-${{ github.sha }}
  cancel-in-progress: false

jobs:
  reuse:                 # 只在推 main 时开机器（GitHub 按任务向上取整到分钟计费，空跑也算 1 分钟）
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      hit: ${{ steps.r.outputs.hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { sparse-checkout: tools/ci_reuse.sh, sparse-checkout-cone-mode: false }
      - id: r
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash tools/ci_reuse.sh tests-fast

  fast:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.hit != '1' }}   # reuse 没开机器（PR / 分支）或查询出错 → 照常测试；只有命中才跳过
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NBQ_CACHE: ${{ github.workspace }}/.nbq-cache
      TZ: Australia/Melbourne
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 取 origin/main（migration_audit 的「已合并的迁移不许改」要对照它）
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main || echo '取不到 origin/main，migration_audit 会跳过这一项'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: 系统依赖（PostgreSQL 16 + PostGIS）
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-postgis-3
          pip install --break-system-packages -q pglast || pip install -q pglast
      - name: 依赖缓存（PGlite、pg）
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nbq-cache
          key: nbq-fast-${{ runner.os }}-${{ hashFiles('tests/pg/package.json', 'tests/schema/package.json', 'tests/lint/package.json') }}
      - name: 跑测试（静态 + 单元 + 数据库）
        run: node tests/run_all.mjs --quick --fast --only=static,unit,schema,pg --jobs=2
      - name: 摘要
        if: always()
        run: |
          R=$(ls -td tests/reports/*/ 2>/dev/null | head -1)
          if [ -n "$R" ] && [ -f "$R/summary.md" ]; then cat "$R/summary.md" >> "$GITHUB_STEP_SUMMARY"; else echo "没有生成报告（环境准备阶段失败，看上面的日志）" >> "$GITHUB_STEP_SUMMARY"; fi

      # 结果也写成注解：会话里的 Claude 用 gh api 读得到（日志和附件下载在会话里被拦）
      - name: 结果注解
        if: always()
        run: |
          R=$(ls -td tests/reports/*/ 2>/dev/null | head -1)
          [ -n "$R" ] && [ -f "$R/results.json" ] || { echo "::error title=测试没跑起来::环境准备阶段失败"; exit 0; }
          python3 - "$R/results.json" <<'PY'
          import json, sys
          rs = json.load(open(sys.argv[1]))['results']
          bad = [r for r in rs if not r['ok']]
          print(f"::notice title=测试结果::{len(rs)} 项，失败 {len(bad)} 项" + ("：" + "、".join(r['id'] for r in bad) if bad else ""))
          slow = sorted(rs, key=lambda r: -r.get('ms', 0))[:8]   # E2：用时最长的几项（会话里量前后用时靠它）
          print("::notice title=用时最长::" + "、".join(f"{r['id']} {r.get('ms', 0) // 1000}s" for r in slow) + f"；合计 {sum(r.get('ms', 0) for r in rs) // 1000}s")
          for r in bad[:10]:
              msg = '；'.join(r.get('why', []) + r.get('fails', [])).replace('\n', ' ')[:3000]   # fails = 具体的 FAIL / 报错行（run_all 记的）
              print(f"::error title={r['id']}::{msg}")
          PY

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.run_number }}
          path: tests/reports/
          retention-days: 14
