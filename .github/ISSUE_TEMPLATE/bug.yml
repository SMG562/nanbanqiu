name: 问题 / 逃逸缺陷
description: 用户或我们发现的问题（修之前先写会失败的测试）
labels: ["bug"]
body:
  - type: textarea
    id: seen
    attributes:
      label: 看到了什么（设备 / 浏览器 / 页面 / 步骤）
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: 应该是什么样
    validations: { required: true }
  - type: textarea
    id: stop
    attributes:
      label: 是否已经影响用户？先止血了吗（回退 / 关开关）
  - type: textarea
    id: why-missed
    attributes:
      label: 为什么测试和评审没发现（复盘三问；同类第二次必须升级成自动检查）
      description: 修好后记入 逃逸缺陷.md
