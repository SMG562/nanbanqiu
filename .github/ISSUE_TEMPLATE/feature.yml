name: 新功能 / 任务
description: 开工前把话说清楚（Definition of Ready）
labels: []
body:
  - type: textarea
    id: why
    attributes:
      label: 为什么做（用户的什么问题）
    validations: { required: true }
  - type: textarea
    id: scope
    attributes:
      label: 做什么 / 不做什么（范围）
      description: 验收标准写成「用户做 X，看到 Y」；明确列出这次不做的
    validations: { required: true }
  - type: textarea
    id: entries
    attributes:
      label: 用户可改数据的入口（如有）
      description: grep 出所有修改入口，不是从接口文档列。没有就写「无」
    validations: { required: true }
  - type: textarea
    id: split
    attributes:
      label: 拆成几个 PR（每个 ≤ 200 行手写改动；大功能：扩展库 → 界面（开关关）→ 打开开关）
    validations: { required: true }
  - type: textarea
    id: risk
    attributes:
      label: 风险与回退方式
      description: 涉及登录 / 推送 / 数据读写与迁移 / 启动流程 / Service Worker = 较大风险，走发布流程 B
    validations: { required: true }
  - type: input
    id: owner
    attributes:
      label: 负责人（assignee）与评审人
