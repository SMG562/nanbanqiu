<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>南伴球 · 后台</title>
<style>
:root{--bg:#F4F5F2;--sf:#FFFFFF;--sf2:#F7F8F6;--ink:#16201A;--ink2:#4B564E;--mut:#87908A;--line:#E5E8E4;--g:#176B4D;--g2:#1F8A62;--gw:#EAF4EE;--lime:#C6EA3D;
  --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--hover:rgba(23,107,77,.06);--shadow:0 1px 2px rgba(16,32,24,.05);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1411;--sf:#151C18;--sf2:#1A221D;--ink:#EDF2EE;--ink2:#B8C2BB;--mut:#7E8A82;--line:#26302A;--g:#4FB585;--g2:#5FC796;--gw:#1B2C23;--hover:rgba(79,181,133,.08);--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1411;--sf:#151C18;--sf2:#1A221D;--ink:#EDF2EE;--ink2:#B8C2BB;--mut:#7E8A82;--line:#26302A;--g:#4FB585;--g2:#5FC796;--gw:#1B2C23;--hover:rgba(79,181,133,.08);--shadow:none;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"PingFang SC","Helvetica Neue","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* ---------- 登录 ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:24px}
.lg{width:380px;max-width:100%;background:var(--sf);border-radius:22px;padding:34px 32px 28px;box-shadow:0 20px 50px -24px rgba(10,40,25,.35)}
.lg .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}.lg .brand svg{width:40px;height:40px}.lg .brand b{font-size:19px}.lg .brand span{display:block;font-size:12px;color:var(--mut);font-weight:500}
.lg label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
.lg input,.lg select{width:100%;height:42px;border:1px solid var(--line);background:var(--sf2);border-radius:11px;padding:0 12px;outline:none;color:inherit;font:inherit}
.lg input:focus{border-color:var(--g);background:var(--sf)}
.otp{display:flex;gap:8px}.otp input{text-align:center;font-size:18px;font-weight:700;padding:0}
.lg .go{width:100%;height:44px;border-radius:12px;background:var(--g);color:#fff;font-weight:700;margin-top:22px}
.lg .fine{font-size:11.5px;color:var(--mut);text-align:center;margin-top:14px;line-height:1.6}
/* ---------- 框架 ---------- */
#app{display:none;min-height:100%}
.side{position:fixed;inset:0 auto 0 0;width:224px;background:var(--sf);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;z-index:5}
.side .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}.side .brand svg{width:32px;height:32px}.side .brand b{font-size:16px}.side .brand span{display:block;font-size:11px;color:var(--mut);font-weight:500;letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:10px;color:var(--ink2);font-weight:600;font-size:13.5px;text-align:left}
.nav button:hover{background:var(--hover)}.nav button.on{background:var(--gw);color:var(--g)}
.nav button i{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;background:var(--crit);color:#fff;border-radius:99px;padding:0 6px;line-height:18px}
.nav .sep{height:1px;background:var(--line);margin:10px 8px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px 0;border-top:1px solid var(--line)}
.me .av{width:32px;height:32px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.me b{font-size:13px;display:block}.me small{font-size:11.5px;color:var(--mut)}.me button{margin-left:auto;color:var(--mut)}
.main{margin-left:224px;padding:0 28px 60px;min-width:0}
.top{position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:18px 0 14px;flex-wrap:wrap}
.top h1{font-size:21px;margin:0;letter-spacing:-.01em}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);margin-left:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(12,163,12,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(12,163,12,.45)}70%{box-shadow:0 0 0 7px rgba(12,163,12,0)}100%{box-shadow:0 0 0 0 rgba(12,163,12,0)}}
.filters{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
.seg{display:flex;background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{height:30px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--g);color:#fff}
.btn{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--sf);font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px}
.btn:hover{background:var(--sf2)}.btn.p{background:var(--g);border-color:var(--g);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
/* ---------- 卡片与网格 ---------- */
.grid{display:grid;gap:16px}.g6{grid-template-columns:repeat(6,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.card{background:var(--sf);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.ch{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}.ch b{font-size:15px}.ch small{font-size:12px;color:var(--mut)}.ch .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.sec{margin-top:16px}
.kpi{padding:16px 16px 12px}.kpi .l{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;line-height:1.15}
.kpi .d{font-size:12px;font-weight:600;color:var(--mut)}.kpi .d.up{color:var(--good)}.kpi .d.dn{color:var(--crit)}
.kpi svg.sp{width:100%;height:30px;display:block;margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--sf)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--sf)}
/* 横向条形 */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:var(--lw,96px) 1fr 56px;align-items:center;gap:10px;font-size:12.5px;border-radius:8px;padding:2px 4px;margin:0 -4px}
.bar:hover{background:var(--hover)}
.bar .n{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.bar .t{height:14px;background:var(--sf2);border-radius:4px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--g);border-radius:0 4px 4px 0}
.bar .v{text-align:right;font-weight:700;color:var(--ink)}
.sw{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
/* 表格 */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right}td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--hover)}
.who{display:flex;align-items:center;gap:9px}.who .a{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.who b{font-weight:600;display:block}.who small{color:var(--mut);font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sf2);color:var(--ink2);white-space:nowrap}
.pill.g{background:var(--gw);color:var(--g)}.pill.w{background:rgba(250,178,25,.16);color:#9A6A00}.pill.c{background:rgba(208,59,59,.12);color:var(--crit)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.nodot::before{display:none}
/* 热力图 */
.hm{display:grid;grid-template-columns:28px repeat(17,1fr);gap:3px;font-size:10.5px;color:var(--mut)}
.hm .c{aspect-ratio:1.5;border-radius:3px}.hm .c:hover{outline:2px solid var(--ink);outline-offset:-1px}
.hm .hl{display:flex;align-items:center}.hm .hx{text-align:center}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);margin-top:10px}.legend .ramp{display:flex;gap:2px}.legend .ramp i{width:16px;height:8px;border-radius:2px}
/* 漏斗 */
.fun{display:flex;flex-direction:column;gap:8px}
.fs{display:grid;grid-template-columns:92px 1fr 120px;gap:12px;align-items:center;font-size:12.5px}
.fs .t{height:26px;background:var(--sf2);border-radius:6px;overflow:hidden}.fs .t i{display:flex;align-items:center;height:100%;border-radius:0 6px 6px 0;padding-left:8px;color:#fff;font-size:11.5px;font-weight:700}
.fs .p{color:var(--mut);font-size:12px}.fs .p b{color:var(--ink);font-size:13px;margin-right:6px}
/* 实时动态 */
.feed{display:flex;flex-direction:column;max-height:372px;overflow:hidden}
.ev{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:12.5px;animation:fin .5s ease}
.ev:last-child{border-bottom:0}.ev time{color:var(--mut);font-size:11.5px}.ev b{font-weight:600}.ev small{color:var(--mut)}
@keyframes fin{from{background:var(--gw)}to{background:transparent}}
/* 留存 */
.co td{padding:6px 4px;text-align:center;font-size:12px;border:0}.co td.c{border-radius:4px}.co th{text-align:center;border:0}
/* 提示 */
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 8px 24px -8px rgba(0,0,0,.25);opacity:0;transition:opacity .1s;min-width:120px}
#tip b{font-size:15px;display:block}#tip span{color:var(--mut)}
.insight{display:flex;gap:10px;align-items:flex-start;background:var(--gw);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--ink2);line-height:1.6}.insight b{color:var(--ink)}
.empty{color:var(--mut);font-size:13px;padding:20px;text-align:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}.tabs button{padding:8px 12px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}.tabs button.on{color:var(--ink);border-color:var(--g)}
.search{height:34px;border:1px solid var(--line);background:var(--sf);border-radius:10px;padding:0 12px;width:220px;outline:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.rowacts{display:flex;gap:6px;justify-content:flex-end}
@media(max-width:1200px){.g6{grid-template-columns:repeat(3,1fr)}.g21,.g12{grid-template-columns:1fr}}
@media(max-width:860px){.side{display:none}.main{margin-left:0;padding:0 16px 40px}.g4,.g3,.g2{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,1fr)}}

:root{--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500}}
:root[data-theme="dark"]{--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500}
.lg2{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-bottom:6px}.lg2 span{display:flex;align-items:center;gap:6px}.lg2 i{width:10px;height:10px;border-radius:2px}
#tip .trow{display:flex;align-items:center;gap:6px;margin-top:4px}#tip .trow i{width:12px;height:2px;border-radius:1px}#tip .trow b{font-size:13px;display:inline}
.pbars{display:flex;flex-direction:column;gap:10px}.pb{display:grid;grid-template-columns:var(--lw) 1fr;gap:10px;align-items:center;font-size:12.5px}.pb .n{color:var(--ink2)}
.pt{display:flex;flex-direction:column;gap:2px}.pt span{display:flex;align-items:center;gap:6px;height:12px}.pt i{display:block;height:10px;border-radius:0 3px 3px 0;min-width:2px}.pt em{font-style:normal;font-size:11px;color:var(--ink2);font-weight:600}
.stk{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--sf)}.stk i{display:block;height:100%}.stk i:hover{filter:brightness(1.1)}
.stkl{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--ink2)}.stkl span{display:flex;align-items:center;gap:6px}.stkl i{width:10px;height:10px;border-radius:2px}.stkl b{color:var(--ink)}.stkl small{color:var(--mut)}
.mini{display:inline-block;width:60px;height:6px;border-radius:3px;background:var(--sf2);overflow:hidden;vertical-align:middle}.mini i{display:block;height:100%;background:var(--c1)}
.split{display:flex;height:10px;border-radius:3px;overflow:hidden;gap:2px}.split i{display:block;height:100%}

.hp{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--line);color:var(--mut);font-size:9.5px;font-weight:700;margin-left:5px;cursor:help;vertical-align:1px}
.hp:hover{border-color:var(--g);color:var(--g)}
.uid{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:6px;background:var(--sf2);color:var(--ink2);cursor:pointer;white-space:nowrap}.uid:hover{background:var(--gw);color:var(--g)}
.uid.ok{background:var(--gw);color:var(--g)}.uid.ok::after{content:"已复制";font-size:11px;font-weight:600}
.def{background:var(--sf2);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;line-height:1.9;color:var(--ink2)}.def>b{color:var(--ink);margin-right:8px}.def>div{display:inline}.def small{color:var(--mut)}
.cap{font-size:12px;color:var(--mut);margin:10px 0 0;line-height:1.6}
#tip{max-width:300px}#tip span{display:block;line-height:1.5}

table.clk tbody tr{cursor:pointer}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:12.5px;color:var(--mut)}.pager>div{display:flex;align-items:center;gap:10px}.pager b{color:var(--ink);font-weight:600}.pager .btn[disabled]{opacity:.4;cursor:default}
#ud{position:fixed;inset:0;z-index:40;pointer-events:none}#ud.show{pointer-events:auto}
.ud-bg{position:absolute;inset:0;background:rgba(10,20,15,.28);opacity:0;transition:opacity .2s}#ud.show .ud-bg{opacity:1}
.ud{position:absolute;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--sf);box-shadow:-20px 0 40px -20px rgba(0,0,0,.3);padding:22px;overflow:auto;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}#ud.show .ud{transform:none}
.ud-h{display:flex;align-items:flex-start;justify-content:space-between}.ud-h .who small{display:block;margin-top:2px}.ud-x{font-size:24px;color:var(--mut);line-height:1}
.ud-id{display:flex;align-items:center;gap:8px;margin:14px 0}
.ud-k{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ud-k>div{background:var(--sf2);border-radius:12px;padding:10px}.ud-k small{display:block;font-size:11px;color:var(--mut)}.ud-k b{font-size:14px}
.ud-risk{margin-top:12px;background:rgba(208,59,59,.07);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.ud-risk b{color:var(--crit);margin-right:4px;font-size:13px}
.ud-sec{margin-top:20px}.ud-sec>b{font-size:13.5px;display:block;margin-bottom:8px}
.ud-st{display:flex;background:var(--sf2);border-radius:11px;padding:3px;gap:2px}.ud-st button{flex:1;height:32px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink2)}.ud-st button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.noperm{opacity:.45;cursor:not-allowed!important}
#admR{display:none;position:fixed;inset:0;z-index:80}#admR.show{display:block}.admr-bg{position:absolute;inset:0;background:rgba(16,24,40,.35)}.admr{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:min(440px,calc(100% - 32px));background:var(--card,#fff);border-radius:16px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.2)}.admr .cap{margin:6px 0 10px}.admr-e{color:var(--crit);font-size:12.5px;margin-top:6px;min-height:1em}.admr-msgs div{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.admr-msgs b{min-width:72px}
.adm-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#101828;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.2s;z-index:90;pointer-events:none}.adm-toast.show{opacity:1;transform:translateX(-50%)}
.ud-f{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px}.ud-fl{font-size:12.5px;color:var(--ink2);line-height:1.6}.ud-f label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:10px 0 6px}
.ud-ops{display:flex;flex-wrap:wrap;gap:6px}
.ud-hist{display:flex;flex-direction:column;gap:8px}.ud-hist>div{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12.5px}.ud-hist small{color:var(--mut)}

.navh{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.08em;padding:14px 10px 4px}.navh:first-child{padding-top:2px}
.nav button{height:34px!important}
.now{display:flex;flex-direction:column;gap:14px}.now small{display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin-bottom:8px}
.now-t{display:grid;grid-template-columns:1fr 1fr;gap:8px}.now-t>button{background:var(--sf2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;cursor:pointer}.now-t>button:hover{background:var(--hover)}
.now-t span{font-size:12px;color:var(--ink2)}.now-t b{font-size:21px;font-weight:800;line-height:1.25}.now-t b.warn{color:var(--crit)}.now-t small{margin:0!important;font-weight:500!important;font-size:11.5px;line-height:1.4}
.now-k>div{display:grid;grid-template-columns:1fr 1fr;gap:8px}.now-k>div>div{background:var(--sf2);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;align-items:baseline;row-gap:2px}
.now-k span{font-size:12px;color:var(--ink2);grid-column:1/-1}.now-k b{font-size:22px;font-weight:800}.now-k em{font-style:normal;font-size:11.5px;font-weight:700}.now-k em.up{color:var(--good)}.now-k em.dn{color:var(--crit)}
.now-s button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 2px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.now-s button:last-child{border-bottom:0}.now-s button:hover{background:var(--hover)}
.now-s button b{min-width:24px;font-size:15px;color:var(--crit)}.now-s button span{flex:1;color:var(--ink2)}.now-s button i{font-style:normal;color:var(--mut)}

function lineMulti(el,labels,series,fmtv){const W=el.clientWidth||700,H=240,L=44,R=12,Tp=12,B=26,n=labels.length,mx=Math.max(...series.flatMap(s=>s.vals))*1.12||1;
  const s0=Math.pow(10,Math.floor(Math.log10(mx/4))),nice=[1,2,2.5,5,10].map(k=>k*s0).find(k=>mx/k<=5),top=Math.ceil(mx/nice)*nice;
  const X=i=>L+(n<2?.5:i/(n-1))*(W-L-R),Yv=v=>Tp+(1-v/top)*(H-Tp-B);
  let g='';for(let v=0;v<=top+1e-9;v+=nice)g+=`<line x1="${L}" x2="${W-R}" y1="${Yv(v)}" y2="${Yv(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Yv(v)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${fmtv(v)}</text>`;
  const step=Math.max(1,Math.ceil(n/7));labels.forEach((l,i)=>{if(i%step===0||i===n-1)g+=`<text x="${X(i)}" y="${H-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}" font-size="11" fill="var(--mut)">${l}</text>`});
  series.forEach(s=>{g+=`<path d="${s.vals.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Yv(v).toFixed(1)}`).join('')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    if(series.length<=2){const lv=s.vals[n-1];g+=`<text x="${X(n-1)-4}" y="${Yv(lv)-8}" text-anchor="end" font-size="11.5" font-weight="700" fill="var(--ink2)">${s.name}</text>`}});
  el.innerHTML=`<div class="lg2">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div><svg class="lc" width="${W}" height="${H}" style="display:block;touch-action:none">${g}<line id="xh" y1="${Tp}" y2="${H-B}" stroke="var(--ink)" stroke-opacity=".35" style="display:none"/>${series.map((s,k)=>`<circle class="xd" r="4.5" fill="${s.color}" stroke="var(--sf)" stroke-width="2" style="display:none"/>`).join('')}<rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent" class="hit"/></svg>`;
  const svg=el.querySelector('svg'),xh=svg.querySelector('#xh'),dots=[...svg.querySelectorAll('.xd')];
  svg.querySelector('.hit').addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect(),i=Math.max(0,Math.min(n-1,Math.round((e.clientX-r.left-L)/(W-L-R)*(n-1))));
    xh.setAttribute('x1',X(i));xh.setAttribute('x2',X(i));xh.style.display='';dots.forEach((d,k)=>{d.setAttribute('cx',X(i));d.setAttribute('cy',Yv(series[k].vals[i]));d.style.display=''});
    tip.innerHTML='';const h=document.createElement('span');h.textContent=labels[i];tip.append(h);series.forEach(s=>{const row=document.createElement('div');row.className='trow';row.innerHTML=`<i style="background:${s.color}"></i>`;const b=document.createElement('b');b.textContent=fmtv(s.vals[i]);const nm=document.createElement('span');nm.textContent=s.name;row.append(b,nm);tip.append(row)});
    tip.style.opacity=1;tip.style.left=Math.min(innerWidth-tip.offsetWidth-12,e.clientX+14)+'px';tip.style.top=Math.max(8,e.clientY-tip.offsetHeight-10)+'px'});
  svg.querySelector('.hit').addEventListener('pointerleave',()=>{xh.style.display='none';dots.forEach(d=>d.style.display='none');hideTip()})}

/* ---------- 风险用户：处理阶梯 ----------
 * 受限 vs 暂停：
 *   受限 = 只拿走「容易出问题的那部分」功能（女生局、私信 / 邀约没打过球的人），普通球局照常；长期有效，由管理员手动解除。针对「对谁有风险」。
 *   暂停 = 冷静期：在期限内不能发起、申请、邀约和发消息，只能登录查看；到期自动恢复。针对「行为严重但能改」。 */

UST.suspended[2]='有期限，到期自动恢复 · 期间只能登录查看，不能发起、申请、邀约和发消息；待处理的申请自动撤回，已确认的球局保留';

const RSUG=s=>{const k=s.sig.map(x=>x[0]).join('|');
  if(/爽约/.test(k))return['suspended','暂停 7 天','近 30 天确认爽约 2 次（等级上限按近 90 天）'];
  if(/约定/.test(k))return['suspended','暂停','违反球友约定，按情节 1–180 天'];
  if(/性别|女生/.test(k))return['review','待核实','女生局相关'];
  if(/链接|私信/.test(k))return['limited','受限','对陌生人发消息有风险'];
  if(/婉拒/.test(k))return['limited','受限','反复打扰同一批发起人'];
  return['watch','观察','单一信号，先看看']};

const b1ush=()=>1;   // 第三批：注册数已按注册时的设备分开计算（HIST.nu 按设备读取），不再按比例拆                    // 按注册时用的设备分手机 / 电脑（与新注册同一个比例，保证 新注册 ≤ 总注册）
// 6:00–22:00 每小时开打的球局（相对）
// 一天的球局去向：开打（未取消）/ 人齐 / 取消；今天只算已经到开打时间的
// 去重人数：每天的人数相加会重复计算同一个人。按「池子」饱和：≤ 每天相加，≥ 单日最多，≤ 池子
let B1C={k:''};
function MM(){const k=[S.range,S.plat,T.games,T.nu,T.apps,T.dau,T.applicants,T.shares].join('|');if(B1C.k===k)return B1C.v;
  const one=S.range===1,prevOK=one||HIST.length-1>=2*S.range,v=b1calc(one?[T]:inRange(),one?null:null);
  v.one=one;v.all=isAll();v.prevOK=prevOK;v.ush=b1ush();v.prev=prevOK?b1calc(one?[Y]:prevRange(),one?'yday':null):null;B1C={k,v};return v}

function b1evDay(name,x){const d=x.dau,g=x.games,a=x.apps,ses=x.sessions,nu=x.nu,dd=b1day(x),lg=nu+d*.08;
  const r=Math.max(0,a-x.appr);   // 没通过的申请，按 b1apps 的比例拆开（与「申请的结果」一致）
  const m={session_start:ses,page_view:ses*4.6,page_time:ses*4.3,app_hide:ses*.8,app_show:ses*.7,pwa_first_launch:nu*.3,pwa_installed:nu*.08,
    login_open:lg*1.6,login_send_code:lg*1.25,login_verify:lg*1.05,login_success:lg,signup_complete:nu,logout:d*.004,
    game_select:d*.9,game_view:d*2.1,game_create_start:g*1.6,game_create_submit:g,game_edit:g*.14,game_postpone:g*.03,unfilled_action:g*.1,game_cancel_open:g*.16,game_cancel:g*.12,
    game_apply_open:a*1.35,game_apply_submit:a,game_join_instant:g*.1,host_decide:x.appr+r*.38,host_decline_open:r*.5,apply_expired:r*.14,apply_withdraw:r*.15,game_leave_open:x.appr*.06,game_leave:x.appr*.042,req_sort:g*.05,req_expand:g*.04,
    chat_open:x.msgs*.7,chat_send:x.msgs,invite_open:x.inv*1.5,invite_send:x.inv,invite_accept:x.inv*.5,invite_decline:x.inv*.3,
    card_view:d*.72,game_share_open:x.shares*.9,share_copy_link:x.shares*.22,card_share_open:x.shares*.6,card_share:x.shares*.41,card_customize:d*.02,card_custom_open:d*.015,
    game_start_check:dd.st,game_counted:dd.full*.98,recap_notify:dd.full*2.6,recap_open:dd.full*1.2,
    notif_deliver:g*6.2,notif_open:g*2.4,pact_view:nu*1.1,pact_accept:nu*1.05,soon_open:dd.full*1.1,noshow_confirm:dd.st*.014,badge_earned:dd.full*.2,level_up:dd.full*.06};
  const v=m[name];return v!=null?v:d*(.002+.04*b1h(name)*b1h(name+'x'))}

  const D=todayNow(),DBX=DB,hi=RISK.filter(r=>r.score>=60&&r.st==='open').length,rep=S.reports.filter(r=>r.status==='open').length;
  const tile=(n,v,sub,pg,warn)=>`<button data-pg="${pg}"><span>${n}</span><b class="num${warn&&v?' warn':''}">${v}</b><small>${sub}</small></button>`;
  const tiles=D.left?[tile('还要开打',D.left+' 局',`已人齐 ${D.filled}${D.cancel?` · 今天取消 ${D.cancel}`:''}`,'life'),
    tile('还缺人',D.short+' 局',D.soon?`2 小时内开打 ${D.soon} 局`:'2 小时内开打的都齐了','life',D.soon>0),
    tile('想打没打上',D.unmet+' 人','满员 / 婉拒 / 失效后，今天还没加入别的局','life'),
    tile('申请等处理',D.pend+' 条',D.exp?`15 分钟内失效 ${D.exp} 条`:'暂时没有快失效的','life',D.exp>0)].join(''):'<p class="cap">今天的球局都已开打 ✓</p>';
  const todo=[[rep,'条举报待处理','review'],[hi,'位高风险用户待处理','safety'],[S.pending,'个用户提交的球场待审核','review']].filter(x=>x[0]);
  const notes=[];
  if(D.win){const ids=new Set(D.win.gs.map(g=>g.id)),seek=new Set(D.pendL.filter(p=>ids.has(p.game_id)).map(p=>p.user_id));D.lostIds.forEach(u=>seek.add(u));const open=D.win.gs.filter(g=>(DBX.byGame.get(g.id)||[]).filter(p=>p.role==='player'&&p.status==='approved').length<g.capacity-1).length;
    if(seek.size>=3&&seek.size>open*1.5)notes.push(`今天 ${D.win.a}–${D.win.a+2} 点：<b>${seek.size}</b> 人在找局，只有 <b>${open}</b> 局还有空位 → 可以在微信群里请老球友发局`)}
  const rg=regionRows().filter(r=>r.games>=5).map(r=>({n:r.n,k:r.apps/r.games})),avgK=rg.length?rg.reduce((a,r)=>a+r.k,0)/rg.length:0,top=rg.sort((a,b)=>b.k-a.k)[0];
  if(top&&avgK&&top.k>=avgK*1.25)notes.push(`<b>${esc(top.n)}</b> 每局平均 <b>${top.k.toFixed(1)}</b> 人申请（全市平均 ${avgK.toFixed(1)}）· ${rangeTxt()} → 这里局不够`);
  // 接下来 7 天最集中的 2 小时（已发布、未取消）
  {const now=+NOW,c={};DBX.games.forEach(g=>{if(g.visibility!=='public'||g.status==='cancelled'||g.starts_at<now||g.starts_at>=now+7*DBX.DAY)return;const t=new Date(g.starts_at),k=(DBX.dayOf(g.starts_at)-DBX.L)+'|'+Math.floor(t.getHours()/2)*2;c[k]=(c[k]||0)+1});
    const best=Object.entries(c).sort((p,q)=>q[1]-p[1])[0];if(best&&best[1]>=5){const [off,h]=best[0].split('|').map(Number),dd=new Date(DBX.dms(DBX.L+off)),lab=off===0?'今天':off===1?'明天':'周'+WD[dd.getDay()];
      notes.push(`${lab}${+h<12?'上午':+h<18?'下午':'晚上'} ${h}–${+h+2} 点已有 <b>${best[1]}</b> 局，是接下来 7 天最集中的时段 → 留意场地是否订得到`)}}
  return `<div class="card now"><div class="ch"><b>今天</b><small>每 10 分钟更新 · 上次 ${hm(t)} · 不受上方筛选影响</small></div>
    <div class="now-t">${tiles}</div>
    <div class="now-s"><small>需要处理</small>${todo.length?todo.map(x=>`<button data-pg="${x[2]}"><b class="num">${x[0]}</b><span>${x[1]}</span><i>›</i></button>`).join(''):'<p class="cap">都处理完了 ✓</p>'}</div>
    <div class="now-s"><small>值得注意</small>${notes.length?notes.map(n=>`<p>${n}</p>`).join(''):'<p class="cap">暂时没有明显的供需缺口</p>'}</div></div>`};

  d.classList.add('show');setTimeout(()=>{const i=document.getElementById('admRin');i&&i.focus()},30);
  d.onclick=ev=>{if(ev.target.closest('[data-admrx]')){d.classList.remove('show');return}if(ev.target.closest('[data-admrok]')){const v=document.getElementById('admRin').value.trim();if(v.length<4){document.getElementById('admRe').textContent=ADMIN_ERR.admin_reason_required;return}d.classList.remove('show');cb(v)}};
  d.onkeydown=ev=>{if(ev.key==='Enter')d.querySelector('[data-admrok]').click();if(ev.key==='Escape')d.classList.remove('show')}}
// 新增的两个操作：查看完整手机号（owner）· 查看被举报的对话（运营以上）
function admOwn(el,reason){const k=el.dataset.adm;
  if(k==='phone'){const u=S.ud&&USERS.find(x=>x.id===S.ud);if(!u)return;const ph='+61 4'+String(10000000+Math.floor(b1h(u.id+'ph')*89999999)).replace(/(\d{2})(\d{3})(\d{3})/,'$1 $2 $3');
    el.outerHTML=`<span class="pill nodot mono" title="已记进操作日志">${ph}</span>`;S.audit.unshift([admWho(),'phone.reveal',`${u.name} · ${u.uid.slice(0,8)} · 理由：${reason}`,'刚刚']);return}
  if(k==='msgs'){const r=S.reports.find(x=>x.id===el.dataset.id);if(!r)return;S.audit.unshift([admWho(),'message.read',`${r.id} · 理由：${reason}`,'刚刚']);
    const lines=[[r.target,'（演示）被举报前的一段消息'],[r.who,'（演示）举报人的回复'],[r.target,'（演示）被举报的那条消息']];
    admAskInfo(`被举报的对话 · ${r.id}`,`<p class="cap">只显示这条举报相关的那段对话（举报前 7 天到举报后 1 天）；你查看过已记进操作日志。真实环境从 admin_report_messages() 读取。</p><div class="admr-msgs">${lines.map(l=>`<div><b>${esc(l[0])}</b><span>${esc(l[1])}</span></div>`).join('')}</div>`);return}
  if(k==='cyst'||k==='cywl'||k==='cywd'){cityAct(el,reason);return}
  if(k==='invite'){admToast('已生成邀请：临时密码、两步验证二维码和 10 个恢复码只显示一次（演示）');S.audit.unshift([admWho(),'admin.manage','邀请管理员 · 理由：'+reason,'刚刚']);render()}}
function admAskInfo(title,html){let d=document.getElementById('admR');if(!d){d=document.createElement('div');d.id='admR';document.body.appendChild(d)}
  d.innerHTML=`<div class="admr-bg" data-admrx></div><div class="admr"><b>${esc(title)}</b>${html}<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" data-admrx>关闭</button></div></div>`;d.classList.add('show');d.onclick=ev=>{if(ev.target.closest('[data-admrx]'))d.classList.remove('show')};d.onkeydown=null}
// 不能做的按钮置灰（不隐藏：让人知道有这个功能、需要谁来做）
function admMark(root){(root||document).querySelectorAll('[data-udgo],[data-udop],[data-udg],[data-act],[data-rkst],[data-rkgo],[onclick="exportCSV()"],[data-adm],[data-udst]').forEach(b=>{
    let a=null;if(b.matches('[data-udst]')){const u=S.ud&&USERS.find(x=>x.id===S.ud);a=b.dataset.udst==='banned'||(u&&['banned','deleted'].includes(u.st))?'user.ban':'user.status'}else{const x=admAction(b);a=x&&x.a}
    if(!a)return;const ok=admCan(a);b.classList.toggle('noperm',!ok);if(!ok)b.title='需要'+admNeed(a);else if(b.classList.contains('noperm'))b.removeAttribute('title')})}
new MutationObserver(()=>{clearTimeout(window._admm);window._admm=setTimeout(()=>admMark(),0)}).observe(document.body,{childList:true,subtree:true});
// 只读：导航只留统计页
const _admDrawNav=drawNav;drawNav=function(){if(S.role==='viewer'&&!VIEWER_PAGES.has(S.page))S.page='overview';_admDrawNav();if(S.role==='viewer')document.querySelectorAll('#nav [data-pg]').forEach(b=>{if(!VIEWER_PAGES.has(b.dataset.pg))b.remove()});
  document.querySelectorAll('#nav .navh').forEach(h=>{let n=h.nextElementSibling,any=false;while(n&&!n.classList.contains('navh')){any=true;n=n.nextElementSibling}h.style.display=any?'':'none'})};
// 只读：统计页里出现的昵称一律换成「某球友」（与数据库 nbq_viewer 读不到球友表一致）
let ADM_NAMES=null;const admMask=()=>{if(!ADM_NAMES){const ns=[...new Set(USERS.map(u=>u.name))].filter(n=>n&&n.length>1).sort((a,b)=>b.length-a.length).map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));ADM_NAMES=new RegExp(ns.join('|'),'g')}
  const w=document.createTreeWalker(document.getElementById('page'),NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(ADM_NAMES.test(n.nodeValue)){ADM_NAMES.lastIndex=0;n.nodeValue=n.nodeValue.replace(ADM_NAMES,'某球友')}ADM_NAMES.lastIndex=0}
  document.querySelectorAll('#page .a').forEach(a=>{a.textContent='·'})};
const _admRender=render;render=function(){const r=_admRender.apply(this,arguments);if(S.role==='viewer')admMask();return r};
// 登录：演示身份
const _admLogin=doLogin;doLogin=function(e){const sel=document.getElementById('demoRole');S.role=(sel&&sel.value)||'owner';
  const me=document.querySelector('.side .me');if(me){me.querySelector('b').textContent=admWho();me.querySelector('small').textContent=ROLE_NAME[S.role];me.querySelector('.av').textContent=admWho()[0]}
  const r=_admLogin(e);if(S.audit[0]&&S.audit[0][1]==='login')S.audit[0][0]=admWho();render();return r};

/* ---------------- 城市（地区扩展 R4） ----------------
 * 与数据库 cities（key、名称、网址、状态）相同；区 / 球场 / 球友 / 球局 / 开放时通知我的数量是演示（墨尔本按本页数据算）。
 * 真实环境：城市页读 admin_city_overview()、city_checklist()；改状态 admin_city_status()；导出名单 admin_city_waitlist()；标记已通知 admin_city_waitlist_done()。
 * 顶部城市筛选：两个以上城市试运行 / 正式后才出现；真实环境各页面的接口带 ?city=（统计函数的 p_city）。演示数据只有墨尔本。 */
var CITY_ADM=[
 {key:'melb',zh:'墨尔本',slug:'melbourne',status:'on',beta:'2026-09-01',community:'https://nanbanqiu.com/community',wl:0,wlp:0},
 {key:'syd',zh:'悉尼',slug:'sydney',status:'off',wl:37,wlp:37},
 {key:'bne',zh:'布里斯班',slug:'brisbane',status:'off',wl:12,wlp:12},
 {key:'per',zh:'珀斯',slug:'perth',status:'off',wl:9,wlp:9},
 {key:'adl',zh:'阿德莱德',slug:'adelaide',status:'off',wl:5,wlp:5},
 {key:'cbr',zh:'堪培拉',slug:'canberra',status:'off',wl:3,wlp:3}];
var CITY_ST={off:'未开放',prep:'筹备',beta:'试运行',on:'正式'},CITY_ORDER=['off','prep','beta','on'];
S.city=S.city||'all';
function cityCounts(c){if(c.key!=='melb')return {sub:c.sub||0,ven:c.ven||0,players:0,games:0};
  return {sub:669,ven:VENUES.filter(v=>v[6]!=='pending').length,players:USERS.length,games:Math.round(USERS.length*1.6)}}
function cityChecklist(c){const n=cityCounts(c),d=c.beta?Math.floor((Date.now()-new Date(c.beta))/864e5):-1;
  return [['suburbs','区数据已导入（至少 20 个区）',n.sub>=20,'beta',n.sub],['venues','球场已收录（至少 10 个）',n.ven>=10,'beta',n.ven],['basics','时区、中心、网址、默认位置、分享话题',true,'prep'],
    ['community','当地社群链接',!!c.community,'on'],['beta14','试运行满 14 天',d>=14,'on',d>=0?d+' 天':'']]}
const cityPill=st=>`<span class="pill ${st==='on'?'g':st==='beta'||st==='prep'?'w':'nodot'}">${CITY_ST[st]}</span>`;
function pageCities(){const pick=CITY_ADM.find(c=>c.key===S.cityPick)||CITY_ADM[0],need={prep:'进入筹备前',beta:'进入试运行前',on:'正式开放前'};
  const rows=CITY_ADM.map(c=>{const n=cityCounts(c),ck=cityChecklist(c),okN=ck.filter(x=>x[2]).length,i=CITY_ORDER.indexOf(c.status),nx=CITY_ORDER[i+1],pv=CITY_ORDER[i-1];
    return `<tr${c.key===pick.key?' class="sel"':''}><td><b data-cypick="${c.key}" style="cursor:pointer" title="看检查清单">${esc(c.zh)}</b><br><small class="mono" style="color:var(--mut)">/${esc(c.slug)}</small></td><td>${cityPill(c.status)}</td>
      <td class="r num">${fmt(n.sub)}</td><td class="r num">${fmt(n.ven)}</td><td class="r num">${fmt(n.players)}</td><td class="r num">${fmt(n.games)}</td>
      <td class="r num">${c.wl?`${fmt(c.wlp)}<small style="color:var(--mut)"> / ${fmt(c.wl)}</small>`:'—'}</td><td class="r">${okN} / ${ck.length}</td>
      <td><div class="rowacts">${nx?`<button class="btn sm" data-adm="cyst" data-city="${c.key}" data-to="${nx}" data-label="${esc(c.zh)}：改为${CITY_ST[nx]}">改为${CITY_ST[nx]}</button>`:''}${pv?`<button class="btn sm" data-adm="cyst" data-city="${c.key}" data-to="${pv}" data-label="${esc(c.zh)}：退回${CITY_ST[pv]}">退回</button>`:''}
      ${c.wlp&&['beta','on'].includes(c.status)?`<button class="btn sm" data-adm="cywl" data-city="${c.key}" data-label="导出${esc(c.zh)}「开放时通知我」名单">导出名单</button><button class="btn sm" data-adm="cywd" data-city="${c.key}" data-label="${esc(c.zh)}：标记已通知">标记已通知</button>`:''}</div></td></tr>`}).join('');
  const ck=cityChecklist(pick);
  return `${S.city!=='all'&&S.city!=='melb'?`<div class="card" style="margin-bottom:14px"><small style="color:var(--mut)">演示数据只有墨尔本；真实环境各页面按所选城市读取。</small></div>`:''}<div class="grid g12"><div class="card" style="grid-column:1/-1"><div class="ch"><b>城市</b><small>每个城市一个网址 nanbanqiu.com/城市；没开放的城市打开显示「即将开放」，可以留邮箱</small></div>
  <table><thead><tr><th>城市</th><th>状态</th><th class="r">区</th><th class="r">球场</th><th class="r">球友</th><th class="r">近 30 天球局</th><th class="r">开放时通知我<br><small>待通知 / 登记</small></th><th class="r">上线检查</th><th></th></tr></thead><tbody>${rows}</tbody></table>
  <p style="font-size:12px;color:var(--mut);margin-top:10px">未开放 → 筹备（只有管理员能看，导入区和球场）→ 试运行（能注册能用，首页标「试运行」）→ 正式。往前每一步要过检查清单，往回随时可以退。改状态、导出名单只有超级管理员，要写理由；名单在试运行或正式之后才能导出，发完通知点「标记已通知」，30 天后自动删除。</p></div>
  <div class="card" style="grid-column:1/-1"><div class="ch"><b>上线检查清单</b><small>${esc(pick.zh)} · ${cityPill(pick.status)}</small></div><table><tbody>${ck.map(x=>`<tr><td>${x[2]?'<span style="color:var(--g)">✓</span>':'<span style="color:var(--line)">—</span>'} ${esc(x[1])}${x[4]!==undefined&&x[4]!==''?` <small style="color:var(--mut)">现在 ${esc(String(x[4]))}</small>`:''}</td><td class="r"><small style="color:var(--mut)">${need[x[3]]}</small></td></tr>`).join('')}</tbody></table>
  <p style="font-size:12px;color:var(--mut);margin-top:10px">网址：<span class="mono">nanbanqiu.com/${esc(pick.slug)}</span> · 社群链接：${pick.community?`<span class="mono">${esc(pick.community)}</span>`:'未填'}</p></div></div>`}
// 城市操作（理由已填）：演示里按同一份检查清单拦下，记操作日志
function cityAct(el,reason){const c=CITY_ADM.find(x=>x.key===el.dataset.city);if(!c)return;const k=el.dataset.adm;
  if(k==='cyst'){const to=el.dataset.to,up=CITY_ORDER.indexOf(to)>CITY_ORDER.indexOf(c.status);
    if(up){const miss=cityChecklist(c).filter(x=>!x[2]&&CITY_ORDER.indexOf(x[3])<=CITY_ORDER.indexOf(to));if(miss.length){admToast(ADMIN_ERR.admin_city_not_ready+'：'+miss.map(x=>x[1]).join('；'));return}}
    if(to==='beta'&&c.status!=='beta')c.beta=new Date().toISOString().slice(0,10);c.status=to;S.audit.unshift([admWho(),'city.manage',`${c.zh} → ${CITY_ST[to]} · 理由：${reason}`,'刚刚']);render();return}
  if(k==='cywl'){S.audit.unshift([admWho(),'city.waitlist',`${c.zh} · 导出 ${c.wlp} 个邮箱 · 理由：${reason}`,'刚刚']);admToast(`已导出 ${c.wlp} 个邮箱（演示；真实环境下载 CSV）`);render();return}
  if(k==='cywd'){S.audit.unshift([admWho(),'city.waitlist',`${c.zh} · 标记已通知 ${c.wlp} 个 · 理由：${reason}`,'刚刚']);c.wlp=0;render()}}
addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-cypick]');if(a){S.cityPick=a.dataset.cypick;render()}});
// 顶部城市筛选：两个以上城市试运行 / 正式后出现
function citySel(){const sel=document.getElementById('citySel');if(!sel)return;const open=CITY_ADM.filter(c=>['beta','on'].includes(c.status));
  if(open.length<2){sel.style.display='none';S.city='all';return}
  sel.style.display='';sel.innerHTML=`<option value="all">全部城市</option>`+open.map(c=>`<option value="${c.key}">${esc(c.zh)}</option>`).join('');sel.value=open.some(c=>c.key===S.city)?S.city:'all';S.city=sel.value;
  sel.onchange=()=>{S.city=sel.value;render()}}
const _cityRender=render;render=function(){const r=_cityRender.apply(this,arguments);citySel();return r};
</script></body></html>
